{right}/${mode==='pairs'?4:5} ${T('correct','సరైనవి')}</p><p class="badge">${right>=4?T('Practice star ★','సాధన స్టార్ ★'):T('Keep exploring ☆','సాధన కొనసాగించండి ☆')}</p><p>${T('Every attempt is practice. Review the answers, then try again.','ప్రతి ప్రయత్నం సాధనే. జవాబులు చూసి మళ్లీ ప్రయత్నించండి.')}</p><button data-go="setup" class="primary">${T('Play again','మళ్లీ ఆడు')}</button></div>`);return}if(screen==='progress'){html(`${back()}<h1>${T('My practice','నా సాధన')}</h1><div class="card"><p>★ ${saved.stars}</p>${Object.entries(modes).map(([m,v])=>`<p>${v[lang==='te'?1:0]}: ${Number(saved.best[m])||0} ${T('best points','ఉత్తమ పాయింట్లు')}</p>`).join('')}<p>${T('Saved on this browser. Not a school grade or certificate.','ఈ బ్రౌజర్‌లో సేవ్ అవుతుంది. పాఠశాల మార్కులు లేదా ధృవపత్రం కాదు.')}</p></div>`);return}if(screen==='suggest'){html(`${back()}<h1>${T('Suggestion box','సూచనల పెట్టె')}</h1><p>${T('Do not enter private details. Saved on this device only, not sent to Srinivas.','వ్యక్తిగత వివరాలు ఇవ్వవద్దు. ఈ పరికరంలోనే సేవ్ అవుతుంది; శ్రీనివాస్‌కు పంపబడదు.')}</p><label for="idea">${T('Your idea','మీ ఆలోచన')}</label><textarea id="idea" maxlength="500"></textarea><button id="saveidea" class="primary">${T('Save here','ఇక్కడ సేవ్')}</button><p id="msg" role="status"></p>`);try{$('#idea').value=localStorage.getItem('svmm.idea')||''}catch(e){}$('#saveidea').onclick=()=>{try{localStorage.setItem('svmm.idea',$('#idea').value);$('#msg').textContent=T('Saved here. Nothing sent.','ఇక్కడ సేవ్ అయింది. పంపబడలేదు.')}catch(e){$('#msg').textContent=T('Storage unavailable. Copy the text elsewhere.','సేవ్ చేయలేకపోయాం. వేరే చోట కాపీ చేయండి.')}};return}guide()}
function problem(){let n=[10,30,60][band]+(level-1)*[5,10,20][band],a=R(n)+1,b=R(n)+1,op=band>0&&level>1?R(3):R(2);if(op===2){a=R(band===2?12:8)+1;b=R(9)+1;return{show:`${a} × ${b}`,answer:a*b,why:`${a} × ${b} = ${a*b}`}}if(op===1){if(a<b)[a,b]=[b,a];return{show:`${a} − ${b}`,answer:a-b,why:`${a} − ${b} = ${a-b}`}}return{show:`${a} + ${b}`,answer:a+b,why:`${a} + ${b} = ${a+b}`}}
function next(){stop();round++;if(round>5){finish();return}if(mode==='pairs'){let items=[],used=new Set();while(items.length<4){let p=problem();if(used.has(p.answer))continue;used.add(p.answer);items.push(p)}g={cards:shuffle(items.flatMap((p,i)=>[{k:i,text:p.show},{k:i,text:String(p.answer)}])),open:[],matched:[],lock:false,moves:0};draw();return}if(mode==='seq'){let a=Array.from({length:Math.min(7,band+level+2)},()=>R(10));g={show:a.join('  '),answer:a.join(' '),why:a.join(' '),hidden:false}}else if(mode==='speed'){let a=String(R(9)+1)+Array.from({length:Math.min(5,band+level+1)-1},()=>R(10)).join('');g={show:a,answer:a,why:a,hidden:false}}else if(mode==='pattern'){let start=R(10),step=level+band+1,a=Array.from({length:4},(_,i)=>start+i*step),ans=a[3]+step;g={show:a.join(', ')+', ?',answer:ans,why:a.join(', ')+', '+ans+' ('+T('add','కలపండి')+' '+step+')',hidden:true}}else g={...problem(),hidden:false};g.done=false;draw();if(!g.hidden)later(()=>{g.hidden=true;sfx('hide');draw()},mode==='speed'?3500-level*500:4500+band*500)}
function draw(){if(mode==='pairs'){html(`${back()}<h2>${name()}</h2><p>${T('Find four equation-answer pairs. Tap two cards.','నాలుగు లెక్క-జవాబు జంటలు కనుగొనండి. రెండు కార్డులు నొక్కండి.')}</p><div class="tiles">${g.cards.map((c,i)=>`<button class="tile ${g.matched.includes(c.k)?'matched':''}" data-tile="${i}" ${g.matched.includes(c.k)?'disabled':''} aria-label="${g.open.includes(i)||g.matched.includes(c.k)?E(c.text):T('Hidden card','దాచిన కార్డు')+' '+(i+1)}">${g.open.includes(i)||g.matched.includes(c.k)?E(c.text):'?'}</button>`).join('')}</div><p role="status">${g.matched.length}/4 ${T('pairs','జంటలు')} · ${g.moves} ${T('tries','ప్రయత్నాలు')}</p>`);document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{let i=+b.dataset.tile;if(g.lock||g.open.includes(i)||g.matched.includes(g.cards[i].k))return;g.open.push(i);sfx('flip');if(g.open.length===2){g.moves++;g.lock=true;let [a,b]=g.open;if(g.cards[a].k===g.cards[b].k){g.matched.push(g.cards[a].k);right++;score+=100;sfx('match');speak(T('Pair matched!','\u0c1c\u0c02\u0c1f \u0c38\u0c30\u0c3f\u0c2a\u0c4b\u0c2f\u0c3f\u0c02\u0c26\u0c3f!'));g.open=[];g.lock=false;if(g.matched.length===4){draw();later(finish,600);return}}else{sfx('wrong');later(()=>{if(!g)return;g.open=[];g.lock=false;draw()},900)}}draw()});return}html(`${back()}<h2>${name()} · ${round}/5</h2><div class="card">${!g.hidden?`<p>${T('Remember this. It will hide soon; then type its answer below.','దీన్ని గుర్తుపెట్టుకోండి. ఇది త్వరలో దాగుతుంది; తరువాత దాని జవాబు కింద టైప్ చేయండి.')}</p><div class="memory">${E(g.show)}</div><button id="ready">${T('I am ready','నేను సిద్ధం')}</button>`:`${mode==='pattern'?'<div class="memory">'+E(g.show)+'</div>':'<p>'+T('Now type the answer below and press Check answer.','ఇప్పుడు జవాబు కింద టైప్ చేసి జవాబు తనిఖీ నొక్కండి.')+'</p>'}<label for="answer">${mode==='seq'?T('Numbers in order, separated by spaces','సంఖ్యలను ఖాళీలతో వరుసగా ఇవ్వండి'):T('Your answer','మీ జవాబు')}</label><input id="answer" inputmode="${mode==='seq'?'text':'numeric'}" maxlength="40" autocomplete="off" ${g.done?'disabled':''}><button id="check" class="primary" ${g.done?'disabled':''}>${T('Check answer','జవాబు తనిఖీ')}</button>`}<div id="feedback" role="status">${g.done?`<p class="notice">${g.ok?T('Correct!','సరైనది!'):T('Keep practising.','సాధన కొనసాగించండి.')} ${T('Answer:','జవాబు:')} ${E(g.why)}</p><button id="next">${round===5?T('See result','ఫలితం చూడండి'):T('Next question','తరువాతి ప్రశ్న')}</button>`:''}</div></div>`);if($('#ready'))$('#ready').onclick=()=>{stop();g.hidden=true;draw()};if($('#check')){let check=()=>{if(g.done)return;let v=$('#answer').value.trim().replace(/[ ,]+/g,' ');if(!v){$('#feedback').textContent=T('Enter an answer first.','ముందు జవాబు ఇవ్వండి.');return}g.ok=mode==='seq'?v===g.answer:/^\d+$/.test(v)&&Number(v)===Number(g.answer);g.done=true;if(g.ok){right++;score+=100;sfx('correct')}else sfx('wrong');draw()};$('#check').onclick=check;$('#answer').onkeydown=e=>{if(e.key==='Enter')check()}}if($('#next'))$('#next').onclick=next;if(!sndMuted){if(!g.hidden)speak(T('Remember this.','\u0c26\u0c40\u0c28\u0c4d\u0c28\u0c3f \u0c17\u0c41\u0c30\u0c4d\u0c24\u0c41\u0c2a\u0c46\u0c1f\u0c4d\u0c1f\u0c41\u0c15\u0c4b\u0c02\u0c21\u0c3f.')+' '+say(g.show));else if(g.done)speak((g.ok?T('Correct!','\u0c38\u0c30\u0c48\u0c28\u0c26\u0c3f!'):T('Keep practising.','\u0c38\u0c3e\u0c27\u0c28 \u0c15\u0c4a\u0c28\u0c38\u0c3e\u0c17\u0c3f\u0c02\u0c1a\u0c02\u0c21\u0c3f.'))+' '+T('Answer:','\u0c1c\u0c35\u0c3e\u0c2c\u0c41:')+' '+say(g.why))}}
function finish(){stop();bgm(false);sfx('win');speak(T('Round over. Your score is ','\u0c06\u0c1f \u0c2e\u0c41\u0c17\u0c3f\u0c38\u0c3f\u0c02\u0c26\u0c3f. \u0c2e\u0c40 \u0c38\u0c4d\u0c15\u0c4b\u0c30\u0c41 ')+score+T(' points.',' \u0c2a\u0c3e\u0c2f\u0c3f\u0c02\u0c1f\u0c4d\u0c32\u0c41.')+(right>=4?T(' You earned a practice star!',' \u0c2e\u0c40\u0c15\u0c41 \u0c2a\u0c4d\u0c30\u0c3e\u0c15\u0c4d\u0c1f\u0c40\u0c38\u0c4d \u0c38\u0c4d\u0c1f\u0c3e\u0c30\u0c4d \u0c35\u0c1a\u0c4d\u0c1a\u0c3f\u0c02\u0c26\u0c3f!'):''));if(right>=4)setTimeout(()=>sfx('star'),600);saved.best[mode]=Math.max(Number(saved.best[mode])||0,score);if(right>=4)saved.stars++;save();screen='result';history.replaceState({s:'result'},'','#result');render()}
function guide(){html(`${back()}<h1>${T('Game guide','ఆట మార్గదర్శి')}</h1><div class="card"><h2>${T('How to play','ఎలా ఆడాలి')}</h2><ol><li>${T('Choose a game, band and level. Start easy.','ఆట, తరగతి, స్థాయి ఎంచుకోండి. సులభంగా మొదలు పెట్టండి.')}</li><li>${T('Look, recall and check. Use paper after the round to explain the maths.','చూసి, గుర్తుచేసుకుని, తనిఖీ చేయండి. తరువాత కాగితంపై లెక్క వివరించండి.')}</li><li>${T('100 points for each correct answer or pair. No speed bonus, penalties or public leaderboard. Four correct earns a practice star.','సరైన జవాబు/జంటకు 100 పాయింట్లు. వేగానికి బోనస్, శిక్ష లేదా అందరికీ కనిపించే ర్యాంకులు లేవు. నాలుగు సరైనవి అయితే స్టార్.')}</li><li>${T('Try one short round, then take a break. Return another day. Stop if tired. Adults can help younger children.','చిన్న రౌండ్ తరువాత విరామం తీసుకోండి. మరో రోజు రండి. అలసిపోతే ఆపండి. చిన్నారులకు పెద్దలు సహాయపడవచ్చు.')}</li></ol></div><div class="card"><h2>${T('Levels and skills','స్థాయులు & నైపుణ్యాలు')}</h2>${Object.values(modes).map(v=>`<h3>${v[lang==='te'?1:0]}</h3><p>${v[lang==='te'?3:2]}</p>`).join('')}<p>${T('Three levels increase number range and recall length. Youngest band uses addition and subtraction; older bands also use multiplication. Patterns use a constant step. Flash recall is optional.','మూడు స్థాయిలతో సంఖ్యల పరిధి, వరుస పొడవు పెరుగుతాయి. చిన్నారులకు కూడిక, తీసివేత; పెద్ద వారికి గుణకారం కూడా. క్రమాల్లో ఒకే వ్యత్యాసం ఉంటుంది. వేగ ఆట ఐచ్ఛికం.')}</p></div><div class="card"><h2>${T('Learning value and limits','అభ్యాస ఉపయోగం & పరిమితులు')}</h2><p>${T('Practises the game tasks and arithmetic recall. Not medical advice, an IQ test or a complete Class 1-10 curriculum. Better game scores do not prove better general memory or school marks. Teacher review and child-user trials are not yet done.','ఆట నైపుణ్యాలు, లెక్కలను గుర్తుచేసుకోవడం సాధన చేస్తుంది. వైద్య సలహా, ఐక్యూ పరీక్ష లేదా 1-10 పూర్తి పాఠ్యప్రణాళిక కాదు. ఆటలో మంచి స్కోరు అంటే సాధారణ జ్ఞాపకశక్తి లేదా మార్కులు పెరిగాయని కాదు. ఉపాధ్యా
