t!','సరైనది!'):T('Keep practising.','సాధన కొనసాగించండి.')} ${T('Answer:','జవాబు:')} ${E(g.why)}</p><button id="next">${round===5?T('See result','ఫలితం చూడండి'):T('Next question','తరువాతి ప్రశ్న')}</button>`:''}</div></div>`);if($('#ready'))$('#ready').onclick=()=>{stop();g.hidden=true;draw()};if($('#check')){let check=()=>{if(g.done)return;let v=$('#answer').value.trim().replace(/[ ,]+/g,' ');if(!v){$('#feedback').textContent=T('Enter an answer first.','ముందు జవాబు ఇవ్వండి.');return}g.ok=mode==='seq'?v===g.answer:/^\d+$/.test(v)&&Number(v)===Number(g.answer);g.done=true;if(g.ok){right++;score+=100}draw()};$('#check').onclick=check;$('#answer').onkeydown=e=>{if(e.key==='Enter')check()}}if($('#next'))$('#next').onclick=next}

య సమీక్ష, చిన్నారులతో పరీక్షలు ఇంకా కాలేదు.')}</p><p>${T('No signup, ads, payments or tracking. Progress and suggestions stay on this browser. Clearing browser data removes them.','ఖాతా, ప్రకటనలు, చెల్లింపు, ట్రాకింగ్ లేవు. ప్రగతి, సూచనలు ఈ బ్రౌజర్‌లోనే ఉంటాయి. బ్రౌజర్ డేటా తొలగిస్తే ఇవి పోతాయి.')}</p><p><a href="concept.html">${T('Full concept and data pack','పూర్తి ఆట ప్రణాళిక')}</a></p></div>`)}render();
