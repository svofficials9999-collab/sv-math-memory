const LESSONS=[{"topic":"number-recognition","minClass":1,"maxClass":2,"en":"Numbers and counting","te":"సంఖ్యలు, లెక్కింపు","idea":"Count each object once. Zero means no objects.","ideaTe":"ప్రతి వస్తువును ఒక్కసారి లెక్కించండి. వస్తువులు లేకపోతే సున్నా.","example":"4 objects and 1 more make 5.","exampleTe":"4 వస్తువులకు మరొకటి కలిపితే 5.","watch":"Do not count the same object twice.","watchTe":"ఒకే వస్తువును రెండుసార్లు లెక్కించవద్దు."},{"topic":"addition","minClass":1,"maxClass":3,"en":"Addition","te":"కూడిక","idea":"Join quantities. Count on from the first number.","ideaTe":"పరిమాణాలను కలపండి. మొదటి సంఖ్య నుంచి ముందుకు లెక్కించండి.","example":"18 + 7 = 25. Check: 25 − 7 = 18.","exampleTe":"18 + 7 = 25. తనిఖీ: 25 − 7 = 18.","watch":"Line up ones with ones, tens with tens.","watchTe":"ఒకట్లను ఒకట్ల కింద, పదులను పదుల కింద రాయండి."},{"topic":"subtraction","minClass":1,"maxClass":3,"en":"Subtraction","te":"తీసివేత","idea":"Find what remains or the difference.","ideaTe":"మిగిలిన పరిమాణం లేదా తేడా కనుగొనండి.","example":"32 − 7 = 25. Check: 25 + 7 = 32.","exampleTe":"32 − 7 = 25. తనిఖీ: 25 + 7 = 32.","watch":"Changing the order changes the result.","watchTe":"సంఖ్యల క్రమం మార్చితే ఫలితం మారుతుంది."},{"topic":"patterns","minClass":1,"maxClass":10,"en":"Number patterns","te":"సంఖ్యల క్రమాలు","idea":"Find the change between neighbouring terms. Test it with all the terms.","ideaTe":"పక్కపక్క సంఖ్యల మధ్య మార్పు గుర్తించండి. అన్ని సంఖ్యలతో తనిఖీ చేయండి.","example":"2, 5, 8, 11: add 3 each time.","exampleTe":"2, 5, 8, 11: ప్రతిసారీ 3 కలపండి.","watch":"One example alone may fit many rules.","watchTe":"ఒక్క ఉదాహరణకే ఎన్నో నియమాలు సరిపోవచ్చు."},{"topic":"place-value","minClass":2,"maxClass":10,"en":"Place value","te":"స్థాన విలువ","idea":"From right: ones, tens, hundreds. Ten ones make one ten.","ideaTe":"కుడి నుంచి ఒకట్లు, పదులు, వందలు. పది ఒకట్లు ఒక పది.","example":"347 = 300 + 40 + 7.","exampleTe":"347 = 300 + 40 + 7. ఇందులో 4 విలువ 40.","watch":"A digit and its place value are different.","watchTe":"అంకె, దాని స్థాన విలువ వేర్వేరు."},{"topic":"multiplication","minClass":3,"maxClass":10,"en":"Multiplication","te":"గుణకారం","idea":"Multiply to count equal groups.","ideaTe":"సమాన గుంపుల మొత్తానికి గుణకారం చేయండి.","example":"4 groups of 3: 4 × 3 = 12.","exampleTe":"3 వస్తువులున్న 4 గుంపులు: 4 × 3 = 12.","watch":"The groups must have equal size.","watchTe":"అన్ని గుంపుల్లో వస్తువుల సంఖ్య సమానంగా ఉండాలి."},{"topic":"division","minClass":3,"maxClass":10,"en":"Division","te":"భాగహారం","idea":"Share equally. Dividend = divisor × quotient + remainder.","ideaTe":"సమానంగా పంచండి. భాజ్యం = భాజకం × భాగఫలం + శేషం.","example":"17 ÷ 5: quotient 3, remainder 2. 5 × 3 + 2 = 17.","exampleTe":"17ను 5తో భాగిస్తే భాగఫలం 3, శేషం 2. 5 × 3 + 2 = 17.","watch":"Never divide by zero. Remainder is smaller than a positive divisor.","watchTe":"సున్నాతో భాగించడం నిర్వచించబడదు. శేషం ధన భాజకం కంటే చిన్నదిగా ఉండాలి."},{"topic":"measurement","minClass":3,"maxClass":10,"en":"Measurement","te":"కొలతలు","idea":"Convert to the same units before comparing or adding.","ideaTe":"పోల్చే లేదా కలిపే ముందు ఒకే ప్రమాణంలోకి మార్చండి.","example":"1 m = 100 cm; 2 m 30 cm = 230 cm.","exampleTe":"1 మీటరు = 100 సెంటీమీటర్లు; 2 మీటర్లు 30 సెంటీమీటర్లు = 230 సెంటీమీటర్లు.","watch":"Do not add metres directly to centimetres.","watchTe":"మీటర్లను సెంటీమీటర్లకు నేరుగా కలపవద్దు."},{"topic":"fractions","minClass":4,"maxClass":10,"en":"Fractions","te":"భిన్నాలు","idea":"Denominator: equal parts in a whole. Numerator: parts selected.","ideaTe":"హారం: మొత్తం సమాన భాగాలు. లవం: తీసుకున్న భాగాలు.","example":"3/4 of 20 = (20 ÷ 4) × 3 = 15.","exampleTe":"20లో 3/4 = (20 ÷ 4) × 3 = 15.","watch":"Parts must be equal. Do not add denominators when adding fractions.","watchTe":"భాగాలు సమానంగా ఉండాలి. భిన్నాల కూడికలో హారాలను కలపవద్దు."},{"topic":"geometry","minClass":4,"maxClass":10,"en":"Shapes and angles","te":"ఆకారాలు, కోణాలు","idea":"Triangle: 3 sides. Right angle: 90°. Triangle angles total 180°.","ideaTe":"త్రిభుజానికి 3 భుజాలు. లంబకోణం 90°. త్రిభుజ కోణాల మొత్తం 180°.","example":"Triangle angles 50°, 60°, ?: 180 − 50 − 60 = 70°.","exampleTe":"త్రిభుజ కోణాలు 50°, 60°, ?: 180 − 50 − 60 = 70°.","watch":"A diagram may not be drawn to scale.","watchTe":"బొమ్మ నిజమైన కొలతల నిష్పత్తిలో ఉండకపోవచ్చు."},{"topic":"decimals","minClass":5,"maxClass":10,"en":"Decimals","te":"దశాంశాలు","idea":"After the decimal point: tenths, hundredths, thousandths. Align decimal points.","ideaTe":"దశాంశ బిందువు తరువాత పదవ, నూరవ, వెయ్యవ వంతులు. బిందువులు ఒకదాని కింద ఒకటి రాయండి.","example":"2.35 + 0.40 = 2.75.","exampleTe":"2.35 + 0.40 = 2.75.","watch":"0.5 = 0.50, but 0.5 is not 0.05.","watchTe":"0.5 = 0.50, కానీ 0.5 విలువ 0.05 కాదు."},{"topic":"mensuration","minClass":5,"maxClass":10,"en":"Perimeter and area","te":"చుట్టుకొలత, వైశాల్యం","idea":"Rectangle: perimeter = 2(l+w); area = l × w.","ideaTe":"దీర్ఘచతురస్రం: చుట్టుకొలత = 2(పొడవు+వెడల్పు); వైశాల్యం = పొడవు × వెడల్పు.","example":"6 cm × 4 cm rectangle: area 24 cm², perimeter 20 cm.","exampleTe":"6 సెం.మీ. × 4 సెం.మీ.: వైశాల్యం 24 చ.సెం.మీ., చుట్టుకొలత 20 సెం.మీ.","watch":"Area uses square units; perimeter uses length units.","watchTe":"వైశాల్యానికి చదరపు ప్రమాణాలు; చుట్టుకొలతకు పొడవు ప్రమాణాలు."},{"topic":"factors-multiples","minClass":6,"maxClass":10,"en":"Factors, multiples and HCF","te":"కారణాంకాలు, గుణిజాలు, గ.సా.భా.","idea":"A factor divides exactly. HCF is the greatest shared factor.","ideaTe":"కారణాంకంతో భాగిస్తే శేషం సున్నా. ఉమ్మడి కారణాంకాల్లో అతిపెద్దది గ.సా.భా.","example":"12: factors 1,2,3,4,6,12. 18: factors 1,2,3,6,9,18. HCF = 6.","exampleTe":"12 కారణాంకాలు: 1,2,3,4,6,12. 18 కారణాంకాలు: 1,2,3,6,9,18. గ.సా.భా. = 6.","watch":"HCF cannot exceed either positive number.","watchTe":"ధన సంఖ్యల గ.సా.భా. ఆ రెండు సంఖ్యల్లో ఏదానికంటే పెద్దది కాదు."},{"topic":"lcm","minClass":6,"maxClass":10,"en":"LCM","te":"క.సా.గు.","idea":"The smallest shared positive multiple. For positive integers: LCM = product ÷ HCF.","ideaTe":"అతి చిన్న ఉమ్మడి ధన గుణిజం. ధన పూర్ణ సంఖ్యలకు: క.సా.గు. = లబ్ధం ÷ గ.సా.భా.","example":"Multiples of 4: 4,8,12. Multiples of 6: 6,12. LCM = 12.","exampleTe":"4 గుణిజాలు: 4,8,12. 6 గుణిజాలు: 6,12. క.సా.గు. = 12.","watch":"Product is not always the LCM.","watchTe":"లబ్ధం ఎప్పుడూ కనిష్ఠ సామాన్య గుణిజం కాదు."},{"topic":"ratio","minClass":6,"maxClass":10,"en":"Ratio and proportion","te":"నిష్పత్తి, అనుపాతం","idea":"Compare quantities in the same units. Scale both ratio parts equally.","ideaTe":"ఒకే ప్రమాణంలోని పరిమాణాలను పోల్చండి. నిష్పత్తి భాగాలను ఒకే సంఖ్యతో గుణించండి.","example":"2:3 with total 25: 5 shares of 5; quantities 10 and 15.","exampleTe":"2:3 నిష్పత్తిలో మొత్తం 25: 5 భాగాలు, ఒక్క భాగం 5; పరిమాణాలు 10,15.","watch":"Scale both parts, not just one.","watchTe":"ఒక్క భాగాన్ని కాకుండా రెండు భాగాలనూ మార్చాలి."},{"topic":"algebra","minClass":6,"maxClass":10,"en":"Algebra","te":"బీజగణితం","idea":"A variable represents a number. Substitute, then follow operation order.","ideaTe":"చరరాశి ఒక సంఖ్యకు గుర్తు. విలువ పెట్టి క్రియల క్రమం పాటించండి.","example":"x = 4: 3x + 2 = 3 × 4 + 2 = 14.","exampleTe":"x = 4 అయితే 3x + 2 = 3 × 4 + 2 = 14.","watch":"3x means 3 × x, not 3 + x.","watchTe":"3x అంటే 3 × x; 3 + x కాదు."},{"topic":"equations","minClass":7,"maxClass":10,"en":"Linear equations","te":"రేఖీయ సమీకరణాలు","idea":"An equation is a balance. Do the same operation to both sides.","ideaTe":"సమీకరణం తూకం లాంటిది. రెండు వైపులా ఒకే క్రియ చేయాలి.","example":"3x + 2 = 14 → 3x = 12 → x = 4. Substitute to check.","exampleTe":"3x + 2 = 14 → 3x = 12 → x = 4. విలువ పెట్టి తనిఖీ చేయండి.","watch":"Changing just one side breaks the balance.","watchTe":"ఒక వైపునే మార్చితే సమానత్వం దెబ్బతింటుంది."},{"topic":"percentages","minClass":7,"maxClass":10,"en":"Percentages","te":"శాతాలు","idea":"Percent means per hundred. p% of n = p × n ÷ 100.","ideaTe":"శాతం అంటే ప్రతి వందలో భాగం. nలో p శాతం = p × n ÷ 100.","example":"20% of 150 = 30. After a 20% discount: 150 − 30 = 120.","exampleTe":"150లో 20% = 30. 20% తగ్గింపు తరువాత: 150 − 30 = 120.","watch":"A 20% rise then 20% fall does not cancel out.","watchTe":"20% పెరుగుదల తరువాత 20% తగ్గుదల వస్తే మొదటి విలువ తిరిగి రాదు."},{"topic":"statistics","minClass":6,"maxClass":10,"en":"Data and averages","te":"దత్తాంశం, సగటులు","idea":"Mean = total ÷ count. Median = middle after sorting. Mode = most frequent value.","ideaTe":"సగటు = మొత్తం ÷ సంఖ్యల సంఖ్య. క్రమంలో మధ్యది మధ్యగతం. ఎక్కువసార్లు వచ్చేది బాహుళకం.","example":"2,3,3,8: mean 4, median 3, mode 3.","exampleTe":"2,3,3,8: సగటు 4, మధ్యగతం 3, బాహుళకం 3.","watch":"For even count, median averages the two middle values.","watchTe":"సంఖ్యల సంఖ్య సరి అయితే మధ్య రెండు విలువల సగటు మధ్యగతం."},{"topic":"probability","minClass":8,"maxClass":10,"en":"Probability","te":"సంభావ్యత","idea":"For equally likely outcomes: favourable ÷ total. Probability is from 0 to 1.","ideaTe":"సమాన అవకాశాల ఫలితాలకు: అనుకూల ఫలితాలు ÷ మొత్తం ఫలితాలు. సంభావ్యత 0 నుంచి 1 మధ్య ఉంటుంది.","example":"Fair die, even number: 3/6 = 1/2 = 50%.","exampleTe":"సమాన అవకాశాల పాచిక, సరి సంఖ్య: 3/6 = 1/2 = 50%.","watch":"The formula requires equally likely outcomes.","watchTe":"ఈ సూత్రానికి అన్ని ఫలితాల అవకాశాలు సమానంగా ఉండాలి."},{"topic":"coordinate-geometry","minClass":9,"maxClass":10,"en":"Coordinate geometry","te":"నిరూపక జ్యామితి","idea":"Distance = √((x₂−x₁)²+(y₂−y₁)²). Midpoint averages the coordinates.","ideaTe":"దూరం = √((x₂−x₁)²+(y₂−y₁)²). మధ్యబిందువుకు నిరూపకాల సగటులు తీసుకోండి.","example":"(0,0) to (3,4): √(9+16) = 5.","exampleTe":"(0,0) నుంచి (3,4): √(9+16) = 5.","watch":"(2,5) and (5,2) are different points.","watchTe":"(2,5), (5,2) వేర్వేరు బిందువులు."},{"topic":"trigonometry","minClass":10,"maxClass":10,"en":"Trigonometry","te":"త్రికోణమితి","idea":"Right triangle: sin θ = opposite/hypotenuse; cos θ = adjacent/hypotenuse; tan θ = opposite/adjacent.","ideaTe":"లంబకోణ త్రిభుజం: sin θ = ఎదురుభుజం/కర్ణం; cos θ = ఆసన్నభుజం/కర్ణం; tan θ = ఎదురుభుజం/ఆసన్నభుజం.","example":"Opposite 3, adjacent 4, hypotenuse 5: sin θ = 3/5, cos θ = 4/5, tan θ = 3/4.","exampleTe":"ఎదురుభుజం 3, ఆసన్నభుజం 4, కర్ణం 5: sin θ = 3/5, cos θ = 4/5, tan θ = 3/4.","watch":"Choose the angle first. The opposite side depends on it.","watchTe":"ముందు కోణాన్ని ఎంచుకోండి. దానికి ఎదురుగా ఉన్నది ఎదురుభుజం."},{"topic":"advanced-practice","minClass":10,"maxClass":10,"en":"Identities revision","te":"సర్వసమానతల పునశ్చరణ","idea":"(a+b)² = a²+2ab+b²; a²−b² = (a−b)(a+b).","ideaTe":"(a+b)² = a²+2ab+b²; a²−b² = (a−b)(a+b).","example":"9²−4² = (9−4)(9+4) = 5 × 13 = 65.","exampleTe":"9²−4² = (9−4)(9+4) = 5 × 13 = 65.","watch":"(a+b)² is not a²+b².","watchTe":"(a+b)² విలువ a²+b² కాదు."},{"topic":"money","minClass":2,"maxClass":5,"en":"Money","te":"డబ్బు లెక్కలు","idea":"Add costs. Change = amount paid − total cost.","ideaTe":"ధరలను కలపండి. చిల్లర = ఇచ్చిన మొత్తం − మొత్తం ధర.","example":"Pay ₹50 for an item costing ₹32: change ₹18.","exampleTe":"₹32 వస్తువుకు ₹50 ఇస్తే చిల్లర ₹18.","watch":"Keep rupees and paise in matching units.","watchTe":"రూపాయలు, పైసలను ఒకే ప్రమాణంలోకి మార్చండి."},{"topic":"time","minClass":2,"maxClass":5,"en":"Time and calendars","te":"సమయం, క్యాలెండరు","idea":"60 minutes = 1 hour; 24 hours = 1 day.","ideaTe":"60 నిమిషాలు = 1 గంట; 24 గంటలు = 1 రోజు.","example":"From 2:15 to 3:00 is 45 minutes.","exampleTe":"2:15 నుంచి 3:00 వరకు 45 నిమిషాలు.","watch":"Hours are not groups of 100 minutes.","watchTe":"గంటలో 100 నిమిషాలు ఉండవు."},{"topic":"shapes","minClass":1,"maxClass":3,"en":"Shapes around us","te":"మన చుట్టూ ఆకారాలు","idea":"A triangle has 3 sides; square and rectangle have 4.","ideaTe":"త్రిభుజానికి 3 భుజాలు; చతురస్రం, దీర్ఘచతురస్రానికి 4.","example":"A square has 4 equal sides and 4 right angles.","exampleTe":"చతురస్రానికి 4 సమాన భుజాలు, 4 లంబకోణాలు.","watch":"A circle has no straight sides.","watchTe":"వృత్తానికి సరళ భుజాలు ఉండవు."},{"topic":"data","minClass":2,"maxClass":5,"en":"Reading data","te":"దత్తాంశం చదవడం","idea":"A table or pictograph records counts. Check the key before counting symbols.","ideaTe":"పట్టిక లేదా చిత్రలేఖనం సంఖ్యలను చూపుతుంది. గుర్తుల విలువ ముందుగా చూడండి.","example":"If one symbol means 2 books, 4 symbols mean 8 books.","exampleTe":"ఒక గుర్తు 2 పుస్తకాలను సూచిస్తే 4 గుర్తులు 8 పుస్తకాలు.","watch":"A symbol need not mean one item.","watchTe":"ఒక గుర్తు ఎప్పుడూ ఒక్క వస్తువునే సూచించదు."},{"topic":"integers","minClass":6,"maxClass":8,"en":"Integers","te":"పూర్ణ సంఖ్యలు","idea":"Integers include negatives, zero and positives. On a number line, right is greater.","ideaTe":"పూర్ణ సంఖ్యల్లో రుణ సంఖ్యలు, సున్నా, ధన సంఖ్యలు ఉంటాయి. సంఖ్యారేఖపై కుడివైపు పెద్ద విలువలు.","example":"−3 + 5 = 2; −3 × 5 = −15.","exampleTe":"−3 + 5 = 2; −3 × 5 = −15.","watch":"−8 is less than −2.","watchTe":"−8 విలువ −2 కంటే చిన్నది."},{"topic":"rational-numbers","minClass":7,"maxClass":9,"en":"Rational numbers","te":"p/q రూపంలోని సంఖ్యలు","idea":"A rational number can be written p/q for integers p,q with q ≠ 0.","ideaTe":"p,q పూర్ణ సంఖ్యలు, q ≠ 0 అయితే p/q రూపంలో రాయగలది p/q రూపంలోని సంఖ్య.","example":"1/2 + 1/3 = 3/6 + 2/6 = 5/6.","exampleTe":"1/2 + 1/3 = 3/6 + 2/6 = 5/6.","watch":"Use a common denominator for addition.","watchTe":"కూడికకు ఉమ్మడి హారం తీసుకోండి."},{"topic":"powers","minClass":7,"maxClass":9,"en":"Exponents and powers","te":"ఘాతాలు","idea":"For integer powers of a nonzero base: aᵐ × aⁿ = aᵐ⁺ⁿ.","ideaTe":"సున్నా కాని భూమికి పూర్ణ ఘాతాలు: aᵐ × aⁿ = aᵐ⁺ⁿ.","example":"2³ × 2² = 2⁵ = 32.","exampleTe":"2³ × 2² = 2⁵ = 32.","watch":"Add exponents only when multiplying powers of the same base.","watchTe":"ఒకే భూమి ఘాతాల గుణకారంలోనే ఘాతాలను కలపండి."},{"topic":"roots","minClass":8,"maxClass":10,"en":"Squares and roots","te":"వర్గాలు, వర్గమూలాలు","idea":"The principal square root is nonnegative. Square it to check.","ideaTe":"ప్రధాన వర్గమూలం రుణం కాదు. దాన్ని వర్గం చేసి తనిఖీ చేయండి.","example":"√81 = 9 because 9 × 9 = 81.","exampleTe":"√81 = 9 ఎందుకంటే 9 × 9 = 81.","watch":"Solving x² = 81 gives x = 9 or −9, unlike the single principal root.","watchTe":"x² = 81కు x = 9 లేదా −9. ప్రధాన వర్గమూలం మాత్రం 9."},{"topic":"quadrilaterals","minClass":8,"maxClass":10,"en":"Quadrilaterals","te":"చతుర్భుజాలు","idea":"The interior angles of a simple quadrilateral total 360°.","ideaTe":"సరళ చతుర్భుజ అంతర కోణాల మొత్తం 360°.","example":"Angles 80°,90°,100°,?: 360 − 270 = 90°.","exampleTe":"కోణాలు 80°,90°,100°,?: 360 − 270 = 90°.","watch":"A rectangle need not have four equal sides.","watchTe":"దీర్ఘచతురస్రానికి నాలుగు సమాన భుజాలు ఉండనవసరం లేదు."},{"topic":"volume","minClass":8,"maxClass":10,"en":"Volume and surface area","te":"ఘనపరిమాణం, ఉపరితల వైశాల్యం","idea":"Cuboid volume = lwh. Surface area = 2(lw+wh+hl).","ideaTe":"దీర్ఘఘన ఘనపరిమాణం = పొడవు × వెడల్పు × ఎత్తు. ఉపరితల వైశాల్యం = 2(lw+wh+hl).","example":"Cuboid 2 × 3 × 4 cm: volume 24 cm³; surface area 52 cm².","exampleTe":"2 × 3 × 4 సెం.మీ.: ఘనపరిమాణం 24 ఘ.సెం.మీ.; ఉపరితల వైశాల్యం 52 చ.సెం.మీ.","watch":"Volume uses cubic units, not square units.","watchTe":"ఘనపరిమాణానికి ఘన ప్రమాణాలు, చదరపు ప్రమాణాలు కాదు."},{"topic":"polynomials","minClass":9,"maxClass":10,"en":"Polynomials","te":"బహుపదులు","idea":"Polynomial terms have nonnegative integer powers of the variable.","ideaTe":"బహుపది పదాల్లో చరరాశి ఘాతాలు సున్నా లేదా ధన పూర్ణ సంఖ్యలు.","example":"2x²+3x+1 at x=2 is 8+6+1 = 15.","exampleTe":"x=2 అయితే 2x²+3x+1 = 8+6+1 = 15.","watch":"1/x is not a polynomial in x.","watchTe":"1/x అనేది xలో బహుపది కాదు."},{"topic":"linear-two","minClass":9,"maxClass":10,"en":"Equations in two variables","te":"రెండు చరరాశుల సమీకరణాలు","idea":"A linear equation in x,y describes a line. Check an ordered pair by substitution.","ideaTe":"x,yల రేఖీయ సమీకరణం సరళరేఖను సూచిస్తుంది. విలువలు పెట్టి తనిఖీ చేయండి.","example":"x+y=7, x−y=1. Adding gives 2x=8; x=4,y=3.","exampleTe":"x+y=7, x−y=1. కలిపితే 2x=8; x=4,y=3.","watch":"One equation alone usually has many solution pairs.","watchTe":"ఒక్క సమీకరణానికి సాధారణంగా ఎన్నో పరిష్కార జతలు ఉంటాయి."},{"topic":"quadratic","minClass":10,"maxClass":10,"en":"Quadratic equations","te":"వర్గ సమీకరణాలు","idea":"A quadratic has degree 2. Factorise or use the quadratic formula.","ideaTe":"వర్గ సమీకరణ ఘాతం 2. కారణాంకాలుగా విడగొట్టండి లేదా వర్గ సమీకరణ సూత్రం వాడండి.","example":"x²−5x+6=0 → (x−2)(x−3)=0. Roots 2 and 3.","exampleTe":"x²−5x+6=0 → (x−2)(x−3)=0. మూలాలు 2,3.","watch":"When a product is zero, at least one factor is zero.","watchTe":"లబ్ధం సున్నా అయితే కనీసం ఒక కారణాంకం సున్నా."},{"topic":"progressions","minClass":9,"maxClass":10,"en":"Arithmetic progressions","te":"అంకశ్రేఢులు","idea":"Consecutive terms have the same difference d. aₙ = a+(n−1)d.","ideaTe":"వరుస పదాల మధ్య ఒకే తేడా d ఉంటుంది. aₙ = a+(n−1)d.","example":"3,7,11,...: a=3,d=4; fifth term = 3+4×4 = 19.","exampleTe":"3,7,11,...: a=3,d=4; ఐదవ పదం = 3+4×4 = 19.","watch":"The first term uses n=1, not n=0.","watchTe":"మొదటి పదానికి n=1; n=0 కాదు."},{"topic":"circles","minClass":9,"maxClass":10,"en":"Circles","te":"వృత్తాలు","idea":"Diameter = 2r. Circumference = 2πr. Area = πr².","ideaTe":"వ్యాసం = 2r. చుట్టుకొలత = 2πr. వైశాల్యం = πr².","example":"r=7 cm, use π=22/7: circumference 44 cm, area 154 cm².","exampleTe":"r=7 సెం.మీ., π=22/7 తీసుకుంటే చుట్టుకొలత 44 సెం.మీ., వైశాల్యం 154 చ.సెం.మీ.","watch":"22/7 is an approximation to π, not its exact value.","watchTe":"22/7 అనేది πకు ఉజ్జాయింపు మాత్రమే; ఖచ్చితమైన విలువ కాదు."},{"topic":"similarity","minClass":10,"maxClass":10,"en":"Similar triangles","te":"సరూప త్రిభుజాలు","idea":"Similar triangles have equal corresponding angles and proportional corresponding sides.","ideaTe":"సరూప త్రిభుజాల్లో అనురూప కోణాలు సమానం; అనురూప భుజాలు ఒకే నిష్పత్తిలో ఉంటాయి.","example":"Side scale factor 3: a side of 4 becomes 12. Area scale factor is 9.","exampleTe":"భుజాల నిష్పత్తి 3 అయితే 4 భుజం 12 అవుతుంది. వైశాల్యాల నిష్పత్తి 9.","watch":"Area scale is the square of side scale.","watchTe":"వైశాల్యాల నిష్పత్తి భుజాల నిష్పత్తి వర్గం."},{"topic":"lines-angles","minClass":6,"maxClass":10,"en":"Lines and angle pairs","te":"రేఖలు, కోణాల జతలు","idea":"A ray has one endpoint. An angle measures the turn between two rays. A linear pair totals 180°.","ideaTe":"కిరణానికి ఒక చివర ఉంటుంది. రెండు కిరణాల మధ్య మలుపు కోణం. రేఖీయ కోణాల జత మొత్తం 180°.","example":"One angle is 65° on a straight line. The other is 180−65 = 115°.","exampleTe":"సరళరేఖపై ఒక కోణం 65°. మరొకటి 180−65 = 115°.","watch":"Adjacent angles total 180° only when their outer rays form a straight line.","watchTe":"పక్కపక్క కోణాల బయటి కిరణాలు సరళరేఖ ఏర్పరిచినప్పుడే మొత్తం 180°."},{"topic":"symmetry","minClass":6,"maxClass":8,"en":"Reflection symmetry","te":"ప్రతిబింబ సౌష్టవం","idea":"A symmetry line divides a figure into matching reflected halves.","ideaTe":"సౌష్టవ రేఖ ఆకారాన్ని ప్రతిబింబాలుగా సరిపోయే రెండు భాగాలుగా విడగొడుతుంది.","example":"A non-square rectangle has 2 symmetry lines: vertical and horizontal through its centre.","exampleTe":"చతురస్రం కాని దీర్ఘచతురస్రానికి మధ్య నుంచి నిలువు, అడ్డంగా 2 సౌష్టవ రేఖలు.","watch":"A rectangle's diagonals are not generally symmetry lines.","watchTe":"దీర్ఘచతురస్ర కర్ణాలు సాధారణంగా సౌష్టవ రేఖలు కావు."},{"topic":"pythagoras","minClass":8,"maxClass":10,"en":"Pythagoras theorem","te":"పైథాగరస్ సిద్ధాంతం","idea":"In a right triangle, the square of the hypotenuse equals the sum of squares of the other sides.","ideaTe":"లంబకోణ త్రిభుజంలో కర్ణం వర్గం మిగిలిన రెండు భుజాల వర్గాల మొత్తానికి సమానం.","example":"3²+4²=9+16=25=5². Hypotenuse is 5.","exampleTe":"3²+4²=9+16=25=5². కర్ణం 5.","watch":"This formula requires a right triangle; the hypotenuse is opposite 90°.","watchTe":"ఈ సూత్రానికి లంబకోణ త్రిభుజం కావాలి. 90°కు ఎదురుగా ఉన్నది కర్ణం."},{"topic":"constructions","minClass":6,"maxClass":8,"en":"Construct a square","te":"చతురస్ర నిర్మాణం","idea":"Use a ruler for lengths and a compass or set square for perpendicular lines. A square has equal sides and four right angles.","ideaTe":"పొడవులకు స్కేలు, లంబరేఖలకు దిక్సూచి లేదా సెట్ స్క్వేర్ వాడండి. చతురస్రానికి సమాన భుజాలు, నాలుగు లంబకోణాలు.","example":"Draw AB=4 cm. Erect perpendiculars at A and B. Mark AD=BC=4 cm on the same side. Join C to D.","exampleTe":"AB=4 సెం.మీ. గీయండి. A,Bల వద్ద లంబాలు గీయండి. ఒకే వైపు AD=BC=4 సెం.మీ. గుర్తించండి. C,Dలను కలపండి.","watch":"The on-screen diagram is a guide, not a true-scale printable ruler.","watchTe":"తెర బొమ్మ సూచన మాత్రమే. దాన్ని నిజమైన కొలతల స్కేలుగా వాడవద్దు."},{"topic":"graphs","minClass":6,"maxClass":10,"en":"Reading bar and line graphs","te":"స్తంభ, రేఖా చిత్రాలు చదవడం","idea":"A graph connects values with labels and a scale. Read the axis scale before comparing heights. Bar charts compare categories; line graphs can show change over time.","ideaTe":"చిత్రంలో విలువలు, పేర్లు, కొలబద్ద ఉంటాయి. ఎత్తులు పోల్చే ముందు అక్షంపై కొలబద్ద చూడండి. స్తంభచిత్రం వర్గాలను పోలుస్తుంది; రేఖాచిత్రం కాలంతో మార్పును చూపగలదు.","example":"Books read on Monday, Tuesday and Wednesday: 2, 5, 3. Total = 10. Tuesday has 3 more than Monday.","exampleTe":"సోమ, మంగళ, బుధవారాల్లో చదివిన పుస్తకాలు 2,5,3. మొత్తం 10. సోమవారం కంటే మంగళవారం 3 ఎక్కువ.","watch":"A tall bar does not always mean a large difference. Check whether the vertical axis starts at zero and whether the scale is uniform.","watchTe":"ఎత్తైన స్తంభం ఎప్పుడూ పెద్ద తేడా అని కాదు. నిలువు అక్షం సున్నా నుంచి మొదలైందో, కొలబద్ద సమానంగా ఉందో చూడండి."},{"topic":"grouped-statistics","minClass":10,"maxClass":10,"en":"Grouped data: estimated mean","te":"వర్గీకృత దత్తాంశం: అంచనా సగటు","idea":"When only class intervals and frequencies are known, represent each interval by its midpoint. Estimated mean = sum(frequency × midpoint) ÷ total frequency.","ideaTe":"తరగతి అంతరాలు, పౌనఃపున్యాలు మాత్రమే తెలిస్తే ప్రతి అంతరానికి మధ్యవిలువ తీసుకోండి. అంచనా సగటు = (పౌనఃపున్యం × మధ్యవిలువ) లబ్ధాల మొత్తం ÷ మొత్తం పౌనఃపున్యం.","example":"Intervals 0–10, 10–20, 20–30 have frequencies 2, 3, 1. Midpoints 5,15,25. Estimated mean = (2×5+3×15+1×25)/6 = 80/6 ≈ 13.33.","exampleTe":"0–10,10–20,20–30 అంతరాలకు పౌనఃపున్యాలు 2,3,1. మధ్యవిలువలు 5,15,25. అంచనా సగటు = (2×5+3×15+1×25)/6 = 80/6 ≈ 13.33.","watch":"This is generally an estimate: the original values inside each interval are unknown. Grouped median and mode need different formulae and are not covered by this mean lesson.","watchTe":"అంతరాల్లో అసలు విలువలు తెలియవు కాబట్టి ఇది సాధారణంగా అంచనా. వర్గీకృత మధ్యగతం, బాహుళకానికి వేరే సూత్రాలు కావాలి; ఈ సగటు పాఠంలో అవి లేవు."},{"topic":"congruence","minClass":7,"maxClass":10,"en":"Triangle congruence: correspondence","te":"త్రిభుజ సర్వసమానత్వం: అనురూపత","idea":"Congruent triangles have the same shape and size. Correctly match corresponding vertices before comparing sides and angles. SSS, SAS and ASA are congruence criteria; AAA alone gives similarity, not necessarily congruence.","ideaTe":"సర్వసమాన త్రిభుజాల ఆకారం, పరిమాణం ఒకటే. భుజాలు, కోణాలు పోల్చే ముందు అనురూప శీర్షాలు సరిగా జతచేయండి. SSS,SAS,ASA సర్వసమానత్వ నియమాలు. AAAతో సరూపత మాత్రమే తెలుస్తుంది; పరిమాణం సమానం కావాల్సిన అవసరం లేదు.","example":"If △ABC ≅ △PQR, the order gives A↔P, B↔Q, C↔R. Therefore AB=PQ, BC=QR, AC=PR and angle B=angle Q.","exampleTe":"△ABC ≅ △PQR అయితే క్రమం ప్రకారం A↔P,B↔Q,C↔R. కాబట్టి AB=PQ,BC=QR,AC=PR; B కోణం = Q కోణం.","watch":"For SAS the equal angle must be between the two equal sides. Two sides and a non-included angle are not a general congruence rule.","watchTe":"SASలో సమాన కోణం ఇచ్చిన రెండు సమాన భుజాల మధ్య ఉండాలి. రెండు భుజాలు, వాటి మధ్య కాని కోణం సాధారణ సర్వసమానత్వ నియమం కాదు."},{"topic":"trig-identity","minClass":10,"maxClass":10,"en":"Why sin²θ + cos²θ = 1","te":"sin²θ + cos²θ = 1 ఎందుకు?","idea":"For an acute angle in a right triangle, let opposite=a, adjacent=b and hypotenuse=c. Pythagoras gives a²+b²=c². Divide every term by c² to get (a/c)²+(b/c)²=1, hence sin²θ+cos²θ=1.","ideaTe":"లంబకోణ త్రిభుజంలోని అల్ప కోణానికి ఎదురుభుజం a, ఆసన్నభుజం b, కర్ణం c అనుకుందాం. పైథాగరస్ ప్రకారం a²+b²=c². ప్రతి పదాన్ని c²తో భాగిస్తే (a/c)²+(b/c)²=1. కాబట్టి sin²θ+cos²θ=1.","example":"For sides 3,4,5: sin²θ+cos²θ=(3/5)²+(4/5)²=9/25+16/25=1.","exampleTe":"3,4,5 భుజాలకు: sin²θ+cos²θ=(3/5)²+(4/5)²=9/25+16/25=1.","watch":"sin²θ means (sin θ)², not sin(θ²). The right-triangle proof here covers acute angles; extending trigonometry to other angles uses further definitions.","watchTe":"sin²θ అంటే (sin θ)²; sin(θ²) కాదు. ఇక్కడి లంబకోణ త్రిభుజ నిరూపణ అల్ప కోణాలకు. ఇతర కోణాలకు విస్తరించడానికి అదనపు నిర్వచనాలు అవసరం."},{"topic":"heights-distances","minClass":10,"maxClass":10,"en":"Heights and distances","te":"ఎత్తులు, దూరాలు","idea":"Draw a right triangle. Angle of elevation is measured upward from the observer's horizontal line. tan θ = vertical rise ÷ horizontal distance. Include eye height if the observer is above ground.","ideaTe":"లంబకోణ త్రిభుజం గీయండి. పరిశీలకుని అడ్డరేఖ నుంచి పైకి కొలిచేది ఊర్ధ్వకోణం. tan θ = నిలువు ఎత్తు పెరుగుదల ÷ అడ్డదూరం. పరిశీలకుని కళ్ళు నేలపై ఉంటే కంటి ఎత్తును కూడా కలపాలి.","example":"At horizontal distance 12 m, angle of elevation 45°, eye height 1.5 m: rise = 12×tan45°=12 m. Total height = 12+1.5=13.5 m.","exampleTe":"అడ్డదూరం 12 మీ., ఊర్ధ్వకోణం 45°, కంటి ఎత్తు 1.5 మీ. అయితే ఎత్తు పెరుగుదల = 12×tan45°=12 మీ. మొత్తం ఎత్తు = 12+1.5=13.5 మీ.","watch":"The sloping line of sight is not the horizontal distance. The example assumes level ground and a vertical object.","watchTe":"ఏటవాలు దృష్టిరేఖ అడ్డదూరం కాదు. ఉదాహరణలో నేల సమతలంగా, వస్తువు నిలువుగా ఉన్నట్లు భావించాం."},{"topic":"grouped-median","minClass":10,"maxClass":10,"en":"Grouped data: estimated median","te":"వర్గీకృత దత్తాంశం: అంచనా మధ్యగతం","idea":"Add frequencies cumulatively. Find the interval whose cumulative frequency first reaches or exceeds N/2. Use median ≈ L + ((N/2 − C)/f) × h, where L is that interval's lower boundary, C cumulative frequency before it, f its frequency and h its width.","ideaTe":"పౌనఃపున్యాలను సంచితంగా కలపండి. N/2ను మొదట చేరే లేదా దాటే అంతరం మధ్యగత అంతరం. మధ్యగతం ≈ L+((N/2−C)/f)×h. ఇక్కడ L ఆ అంతరం దిగువ హద్దు,C దానికి ముందున్న సంచిత పౌనఃపున్యం,f ఆ అంతరం పౌనఃపున్యం,h వెడల్పు.","example":"Intervals [0,10),[10,20),[20,30), frequencies 2,6,2. N=10,N/2=5. Middle interval: L=10,C=2,f=6,h=10. Median ≈ 10+(5−2)/6×10=15.","exampleTe":"[0,10),[10,20),[20,30) అంతరాల పౌనఃపున్యాలు 2,6,2. N=10,N/2=5. మధ్య అంతరానికి L=10,C=2,f=6,h=10. మధ్యగతం ≈ 10+(5−2)/6×10=15.","watch":"This interpolation estimates a grouped-data median. It is not the exact median of unknown original observations. Use continuous class boundaries; do not divide by zero frequency.","watchTe":"ఇది వర్గీకృత దత్తాంశంలో అంతర్వేశన అంచనా. తెలియని అసలు పరిశీలనల ఖచ్చిత మధ్యగతం కాదు. అవిచ్ఛిన్న తరగతి హద్దులు వాడండి; సున్నా పౌనఃపున్యంతో భాగించవద్దు."},{"topic":"grouped-mode","minClass":10,"maxClass":10,"en":"Grouped data: estimated mode","te":"వర్గీకృత దత్తాంశం: అంచనా బాహుళకం","idea":"For equal-width continuous intervals with one clear modal class, mode ≈ L + ((f₁−f₀)/(2f₁−f₀−f₂))×h. L is the modal class lower boundary; f₁ its frequency; f₀ and f₂ the neighbouring frequencies; h the class width.","ideaTe":"సమాన వెడల్పు అవిచ్ఛిన్న అంతరాల్లో ఒక స్పష్టమైన బాహుళక తరగతి ఉంటే బాహుళకం ≈ L+((f₁−f₀)/(2f₁−f₀−f₂))×h. L బాహుళక తరగతి దిగువ హద్దు,f₁ దాని పౌనఃపున్యం,f₀,f₂ పక్క తరగతుల పౌనఃపున్యాలు,h వెడల్పు.","example":"Intervals [0,10),[10,20),[20,30), frequencies 2,8,4. Modal class [10,20): mode ≈ 10+(8−2)/(16−2−4)×10=16.","exampleTe":"[0,10),[10,20),[20,30) పౌనఃపున్యాలు 2,8,4. బాహుళక తరగతి [10,20). బాహుళకం ≈ 10+(8−2)/(16−2−4)×10=16.","watch":"The modal class is an interval, while estimated mode is a value. Equal highest frequencies or unequal widths need extra care; this lesson does not force a unique mode in those cases.","watchTe":"బాహుళక తరగతి ఒక అంతరం; అంచనా బాహుళకం ఒక విలువ. సమాన అత్యధిక పౌనఃపున్యాలు లేదా అసమాన వెడల్పులకు అదనపు జాగ్రత్త అవసరం. అలాంటి సందర్భాల్లో ఒకే బాహుళకాన్ని బలవంతంగా ఎంచుకోము."},{"topic":"circle-tangents","minClass":10,"maxClass":10,"en":"Equal tangents from one point","te":"ఒక బాహ్య బిందువు నుంచి సమాన స్పర్శరేఖాఖండాలు","idea":"From an external point P, let PA and PB be tangent segments to a circle with centre O. Radii OA and OB are perpendicular to the tangents at A and B. Both right triangles share hypotenuse OP and have equal radii.","ideaTe":"వృత్తానికి బాహ్య బిందువు P నుంచి PA,PB స్పర్శరేఖాఖండాలు అనుకుందాం. కేంద్రం O నుంచి వ్యాసార్థాలు OA,OB స్పర్శబిందువుల వద్ద స్పర్శరేఖలకు లంబం. రెండు లంబకోణ త్రిభుజాలకు కర్ణం OP ఉమ్మడి; వ్యాసార్థాలు సమానం.","example":"Pythagoras: PA²=OP²−OA² and PB²=OP²−OB². Since OA=OB, PA²=PB². Lengths are nonnegative, so PA=PB. If PA=7 cm, PB=7 cm.","exampleTe":"పైథాగరస్: PA²=OP²−OA²,PB²=OP²−OB². OA=OB కాబట్టి PA²=PB². పొడవులు రుణం కావు కాబట్టి PA=PB. PA=7 సెం.మీ. అయితే PB=7 సెం.మీ.","watch":"P must be external and both segments must be tangents to the same circle. A secant cutting the circle twice is not a tangent. The perpendicular-radius tangent theorem is used here as a known result.","watchTe":"P బాహ్య బిందువు కావాలి; రెండు రేఖాఖండాలు ఒకే వృత్తానికి స్పర్శరేఖాఖండాలు కావాలి. వృత్తాన్ని రెండుచోట్ల కోసే రేఖ స్పర్శరేఖ కాదు. వ్యాసార్థం–స్పర్శరేఖ లంబ సిద్ధాంతాన్ని ఇక్కడ తెలిసిన ఫలితంగా వాడాం."},{"topic":"equal-sharing","minClass":3,"maxClass":5,"en":"Fractions as equal shares","te":"సమాన భాగాలుగా భిన్నాలు","idea":"A fraction names equal parts of one whole. In a/b, b is the number of equal parts and a is the number selected. The whole must stay the same when comparing shares.","ideaTe":"ఒక మొత్తంలోని సమాన భాగాలను భిన్నం తెలుపుతుంది. a/bలో b సమాన భాగాల సంఖ్య;a ఎంచుకున్న భాగాల సంఖ్య. భాగాలను పోల్చేటప్పుడు మొత్తం ఒకే పరిమాణంలో ఉండాలి.","example":"Cut one strip into 4 equal parts. Colour 2 parts: 2/4. This is the same length as half of that strip, so 2/4=1/2. Half of 12 counters is 6 counters.","exampleTe":"ఒక పట్టీని 4 సమాన భాగాలుగా చేసి 2 భాగాలకు రంగు వేస్తే 2/4. అదే పట్టీలో సగం పొడవుతో ఇది సమానం కాబట్టి 2/4=1/2. 12 గుళికల్లో సగం 6 గుళికలు.","watch":"Unequal pieces do not each represent 1/b. A larger denominator means smaller individual shares only when the whole is the same size.","watchTe":"అసమాన ముక్కలు ఒక్కొక్కటి 1/b కావు. మొత్తం ఒకే పరిమాణంలో ఉన్నప్పుడే హారం పెరిగితే ఒక్కో భాగం చిన్నదవుతుంది."},{"topic":"length-units","minClass":3,"maxClass":5,"en":"Metres and centimetres","te":"మీటర్లు, సెంటీమీటర్లు","idea":"A metre is 100 centimetres. Multiply metres by 100 to get centimetres. To combine metres and centimetres, first express both in the same unit.","ideaTe":"ఒక మీటరు 100 సెంటీమీటర్లు. మీటర్లను 100తో గుణిస్తే సెంటీమీటర్లు వస్తాయి. మీటర్లు,సెంటీమీటర్లు కలిపేటప్పుడు ముందుగా ఒకే ప్రమాణంలోకి మార్చండి.","example":"2 m 35 cm = 200 cm + 35 cm = 235 cm. A 3 m rope is 300 cm long.","exampleTe":"2 మీ.35 సెం.మీ. = 200 సెం.మీ.+35 సెం.మీ.=235 సెం.మీ. 3 మీటర్ల తాడు పొడవు 300 సెం.మీ.","watch":"A centimetre is smaller than a metre, so the same length has a larger number when measured in centimetres. Screen diagrams are not measuring rulers.","watchTe":"సెంటీమీటరు మీటరు కంటే చిన్నది. అందుకే అదే పొడవును సెంటీమీటర్లలో కొలిస్తే సంఖ్య పెద్దదవుతుంది. తెర బొమ్మలు కొలిచే స్కేళ్లు కావు."},{"topic":"clock-reading","minClass":2,"maxClass":5,"en":"Read a clock","te":"గడియారం చదవండి","idea":"The long minute hand goes once around in 60 minutes. Each numbered step is 5 minutes. The short hour hand moves gradually between hour numbers as minutes pass.","ideaTe":"పొడవైన నిమిషాల ముల్లు 60 నిమిషాల్లో ఒక చుట్టు తిరుగుతుంది. రెండు వరుస సంఖ్యల మధ్య 5 నిమిషాలు. నిమిషాలు గడిచేకొద్దీ చిన్న గంటల ముల్లు గంట సంఖ్యల మధ్య క్రమంగా కదులుతుంది.","example":"At 3:30, the minute hand points at 6 and the hour hand is halfway between 3 and 4. Thirty minutes after 3:30 is 4:00.","exampleTe":"3:30కి నిమిషాల ముల్లు 6ను చూపుతుంది; గంటల ముల్లు 3,4 మధ్యలో ఉంటుంది. 3:30 తర్వాత 30 నిమిషాలకు 4:00 అవుతుంది.","watch":"The hour hand does not stay exactly on 3 throughout the whole hour. An analogue 12-hour clock alone does not tell morning from evening.","watchTe":"గంట అంతా గంటల ముల్లు సరిగ్గా 3 మీదే ఉండదు. 12 గంటల గడియారం మాత్రమే చూసి ఉదయమో సాయంత్రమో చెప్పలేం."},{"topic":"pictographs","minClass":2,"maxClass":6,"en":"Read a picture graph","te":"చిత్రాల దత్తాంశం చదవండి","idea":"A picture graph uses symbols to show counts. Read the key first. If one symbol means 2 books, then 3 symbols mean 3×2=6 books.","ideaTe":"చిత్రాల దత్తాంశంలో గుర్తులతో సంఖ్యలు చూపుతాం. ముందుగా సూచిక చదవండి. ఒక గుర్తు 2 పుస్తకాలు అయితే 3 గుర్తులు అంటే 3×2=6 పుస్తకాలు.","example":"A row has 4 symbols and the key says 1 symbol=5 books. The row represents 20 books. Another row with 2 symbols represents 10 books.","exampleTe":"ఒక వరుసలో 4 గుర్తులు ఉన్నాయి. సూచికలో 1 గుర్తు=5 పుస్తకాలు అంటే ఆ వరుస 20 పుస్తకాలను చూపుతుంది. 2 గుర్తుల మరో వరుస 10 పుస్తకాలను చూపుతుంది.","watch":"Do not count symbols as objects unless the key is 1. These examples use only whole symbols, not half-symbols.","watchTe":"సూచిక 1 అయితే తప్ప గుర్తుల సంఖ్యనే వస్తువుల సంఖ్యగా తీసుకోవద్దు. ఈ ఉదాహరణల్లో పూర్తి గుర్తులే ఉన్నాయి; సగం గుర్తులు లేవు."},{"topic":"money-change","minClass":2,"maxClass":5,"en":"Count money and change","te":"డబ్బు,చిల్లర లెక్కించండి","idea":"Add the values of the coins, not just the number of coins. Change = money paid − price, when the payment is enough. These are learning examples, not a shop or payment service.","ideaTe":"నాణేల సంఖ్యను మాత్రమే కాకుండా వాటి విలువలను కలపండి. ఇచ్చిన డబ్బు సరిపోతే చిల్లర = ఇచ్చిన డబ్బు − ధర. ఇవి అభ్యాస ఉదాహరణలు మాత్రమే; దుకాణం లేదా చెల్లింపు సేవ కాదు.","example":"Two ₹5 coins and three ₹2 coins total ₹10+₹6=₹16. Pay ₹20 for an item priced ₹13: change is ₹7.","exampleTe":"రెండు ₹5 నాణేలు,మూడు ₹2 నాణేల మొత్తం ₹10+₹6=₹16. ₹13 వస్తువుకు ₹20 ఇస్తే చిల్లర ₹7.","watch":"If the payment is less than the price, report how much more is needed instead of calling a negative number change. The coin circles are symbols, not real-size currency.","watchTe":"ఇచ్చిన డబ్బు ధర కంటే తక్కువైతే రుణ సంఖ్యను చిల్లర అనకుండా ఇంకా ఎంత కావాలో చెప్పండి. నాణేల వృత్తాలు గుర్తులు మాత్రమే; నిజ పరిమాణ కరెన్సీ కాదు."},{"topic":"equal-units","minClass":1,"maxClass":3,"en":"Compare and measure lengths","te":"పొడవులు పోల్చి కొలవండి","idea":"Line up starting ends to compare lengths. Measure using equal units placed without gaps or overlaps.","ideaTe":"పొడవులు పోల్చేటప్పుడు మొదటి చివరలను ఒకే చోట ఉంచండి. సమాన ప్రమాణాలను ఖాళీలు,అతిక్రమణలు లేకుండా అమర్చి కొలవండి.","example":"Six small blocks or three blocks twice as long cover the same edge. The edge did not change; the unit changed.","exampleTe":"ఒకే అంచును ఆరు చిన్న దిమ్మెలు లేదా వాటికి రెట్టింపు పొడవున్న మూడు దిమ్మెలు కప్పుతాయి. అంచు మారలేదు;ప్రమాణం మారింది.","watch":"A screen picture is not a real ruler. Handspans vary, so agree on one unit before comparing measurements.","watchTe":"తెరపై బొమ్మ నిజమైన స్కేలు కాదు. చేతి జానలు మారుతాయి;కొలతలు పోల్చే ముందు ఒకే ప్రమాణం ఎంచుకోండి."},{"topic":"capacity-cups","minClass":1,"maxClass":3,"en":"Capacity in equal cups","te":"సమాన కప్పులతో సామర్థ్యం","idea":"Capacity tells how much a container can hold to a chosen mark. Count full cups of the same size.","ideaTe":"ఎంచుకున్న గుర్తు వరకు పాత్ర ఎంత పట్టగలదో సామర్థ్యం చెబుతుంది. ఒకే పరిమాణం గల నిండు కప్పులు లెక్కించండి.","example":"A jug holding six small cups holds three cups that are twice as large. The jug capacity is unchanged.","exampleTe":"ఆరు చిన్న కప్పులు పట్టే కూజాలో వాటికి రెట్టింపు పరిమాణమున్న మూడు కప్పులు పడతాయి. కూజా సామర్థ్యం మారలేదు.","watch":"Do not compare cup counts when cup sizes differ. Container height alone does not tell capacity. Use water carefully with an adult.","watchTe":"కప్పుల పరిమాణం వేరైతే వాటి లెక్కలను నేరుగా పోల్చవద్దు. పాత్ర ఎత్తుతోనే సామర్థ్యం తెలియదు. పెద్దలతో కలిసి నీరు జాగ్రత్తగా వాడండి."},{"topic":"mass-balance","minClass":1,"maxClass":3,"en":"Heavy, light and balanced","te":"బరువు,తేలిక,సమతూకం","idea":"A balance compares mass. The heavier side goes down; a level balance shows equal mass.","ideaTe":"తూకంతో ద్రవ్యరాశులను పోల్చవచ్చు. బరువైన వైపు కిందికి వెళ్తుంది;అడ్డంగా ఉంటే సమాన ద్రవ్యరాశి.","example":"A parcel balances four identical cubes. Its mass is four of those cube units.","exampleTe":"ఒక పొట్లం నాలుగు ఒకే ద్రవ్యరాశి గల ఘనాలతో సమతూకంలో ఉంది. దాని ద్రవ్యరాశి ఆ ఘన ప్రమాణాల్లో నాలుగు.","watch":"A larger object need not be heavier. Use identical unit cubes. This drawing is a model, not a real weighing device.","watchTe":"పెద్ద వస్తువే బరువుగా ఉండాలని లేదు. ఒకే ద్రవ్యరాశి గల ఘనాలను వాడండి. ఈ బొమ్మ ఒక నమూనా;నిజమైన తూకం కాదు."}];
const avatars={SV:'★','01':'🦊','02':'🐼','03':'🐬','04':'🦉','05':'🚀'};
const avatarLabel=()=>avatars[state.avatar]||'★';
const explain=q=>state.lang==='te'?(q.explanationTe||q.explanation):q.explanation;
function lessonLibrary(){page='lessons';let list=LESSONS.filter(l=>chosenClass>=l.minClass&&chosenClass<=l.maxClass);html(`<div class="lesson-hero"><p class="pill">${T('LEARN → TRY → PLAY','నేర్చుకోండి → ప్రయత్నించండి → ఆడండి')}</p><h1>${T('Your maths trail','మీ గణిత ప్రయాణం')}</h1><p>${T('Short lessons with worked examples. Pick your class and learn at your pace.','ఉదాహరణలతో చిన్న పాఠాలు. మీ తరగతి ఎంచుకుని మీ వేగంతో నేర్చుకోండి.')}</p></div><label for="lesson-class">${T('Class','తరగతి')}</label><select id="lesson-class">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${i+1===chosenClass?'selected':''}>${i+1}</option>`).join('')}</select><p class="muted">${list.length} ${T('topic lessons · Some are revision. This is not full board syllabus coverage.','అంశాల పాఠాలు · కొన్ని పునశ్చరణ పాఠాలు. ఇది పూర్తి బోర్డు పాఠ్యప్రణాళిక కాదు.')}</p><div class="grid">${list.map((l,i)=>`<button class="mode lesson-tile" data-lesson="${l.topic}"><span class="lesson-num">${String(i+1).padStart(2,'0')}</span><b>${T(l.en,l.te)}</b><small>${T('Learn with an example','ఉదాహరణతో నేర్చుకోండి')}</small><span class="lesson-go">${T('Open lesson →','పాఠం తెరవండి →')}</span></button>`).join('')}</div><div class="note">${T('Original teaching and practice. Sources guide topic progression; board-by-board chapter mapping, proofs, constructions and full exam papers are still being developed.','సొంత బోధన, సాధన. ఆధారాల ప్రకారం అంశాల క్రమం. బోర్డుల వారీ పూర్తి అధ్యాయాలు, నిరూపణలు, నిర్మాణాలు, పరీక్షా పత్రాలు ఇంకా అభివృద్ధిలో ఉన్నాయి.')}</div><a href="CURRICULUM_SOURCES.md">${T('Coverage and sources','పాఠ్యాంశాలు, ఆధారాలు')}</a>`);$('#lesson-class').onchange=()=>{chosenClass=+$('#lesson-class').value;lessonLibrary()};document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>lessonDetail(b.dataset.lesson));}
function lessonDetail(id){const l=LESSONS.find(l=>l.topic===id);if(!l)return lessonLibrary();page='lesson';window.activeLesson=id;let samples=bank.filter(q=>q.classLevel===chosenClass&&q.topic===id);html(`<button id="lesson-back">← ${T('Lessons','పాఠాలు')}</button><div class="lesson-hero"><p class="pill">${T('Class','తరగతి')} ${chosenClass} · ${T('Read, then practise','చదివి సాధన చేయండి')}</p><h1>${T(l.en,l.te)}</h1></div><div class="card lesson-card"><span class="lesson-num">01</span><h2>${T('The idea','ముఖ్య భావన')}</h2><p>${E(T(l.idea,l.ideaTe))}</p></div><div class="card worked"><span class="lesson-num">02</span><h2>${T('Worked example','వివరించిన ఉదాహరణ')}</h2><p>${E(T(l.example,l.exampleTe))}</p></div><div class="card caution"><h2>${T('Watch out','గుర్తుంచుకోండి')}</h2><p>${E(T(l.watch,l.watchTe))}</p></div>${samples.length?`<div class="card"><h2>${T('Try it yourself','మీరే ప్రయత్నించండి')}</h2><p>${E(T(samples[0].question,samples[0].questionTe))}</p><details><summary>${T('Show explanation','వివరణ చూడండి')}</summary><p>${E(explain(samples[0]))}</p></details><button class="primary" id="lesson-practice">${T('Practise this topic','ఈ అంశం సాధన')}</button></div>`:`<p>${T('Practice for this lesson is still being expanded.','ఈ పాఠం సాధన ప్రశ్నలు ఇంకా అభివృద్ధిలో ఉన్నాయి.')}</p>`}<div class="row"><button id="lesson-prev">← ${T('Previous lesson','మునుపటి పాఠం')}</button><button id="lesson-next">${T('Next lesson','తరువాతి పాఠం')} →</button></div>`);$('#lesson-back').onclick=lessonLibrary;if($('#lesson-practice'))$('#lesson-practice').onclick=()=>{topic=id;difficulty=1;begin('mixed')};let a=LESSONS.filter(x=>chosenClass>=x.minClass&&chosenClass<=x.maxClass),i=a.findIndex(x=>x.topic===id);$('#lesson-prev').disabled=i<=0;$('#lesson-next').disabled=i>=a.length-1;$('#lesson-prev').onclick=()=>lessonDetail(a[i-1].topic);$('#lesson-next').onclick=()=>lessonDetail(a[i+1].topic);}
const originalHome=home;home=function(){originalHome();$('#app').querySelector('.note').insertAdjacentHTML('afterend',`<div class="card curriculum-launch"><span class="lesson-num">✦</span><h2>${T('Learn before you play','ఆడే ముందు నేర్చుకోండి')}</h2><p>${T('59 topic lessons, worked examples, common mistakes and Telugu explanations.','59 అంశాల పాఠాలు, ఉదాహరణలు, సాధారణ తప్పులు, తెలుగు వివరణలు.')}</p><button class="primary" id="open-lessons">${T('Explore lessons →','పాఠాలు చూడండి →')}</button></div>`);$('#open-lessons').onclick=lessonLibrary;};
const originalShow=show;show=function(s){if(s==='lessons'){clearInterval(ticker);music(false);session=null;return lessonLibrary()}return originalShow(s)};
const originalWorlds=worlds;worlds=function(){originalWorlds();$('#app').insertAdjacentHTML('beforeend',`<h2>${T('Choose your class trail','మీ తరగతి ప్రయాణం')}</h2><p>${T('Every trail is free. World badges celebrate practice, never block learning.','ప్రతి ప్రయాణం ఉచితం. ప్రపంచాల గుర్తులు సాధనకు ప్రోత్సాహం; నేర్చుకోవడానికి అడ్డంకి కావు.')}</p><div class="trail">${Array.from({length:10},(_,i)=>{let c=i+1,n=LESSONS.filter(l=>c>=l.minClass&&c<=l.maxClass).length;return `<button class="trail-stop" data-trail="${c}"><span class="trail-number">${c}</span><span><b>${T('Class','తరగతి')} ${c}</b><small>${n} ${T('lessons','పాఠాలు')}</small></span><span>→</span></button>`}).join('')}</div>`);document.querySelectorAll('[data-trail]').forEach(b=>b.onclick=()=>{chosenClass=+b.dataset.trail;lessonLibrary()});};
const oldHtml=html;html=function(s){oldHtml(s);document.querySelectorAll('nav [data-page="lessons"]').forEach(b=>b.textContent=T('Lessons','పాఠాలు'));};
$('#lang').onclick=()=>{state.lang=state.lang==='en'?'te':'en';save();if(page==='lessons')return lessonLibrary();if(page==='lesson')return lessonDetail(activeLesson);if(page==='play'&&session)return session.mode==='match'?drawPairs():draw();if(page==='setup'){let m=$('#begin')&&window.setupMode;if(m)return setup(m)}show(['result','setup'].includes(page)?'home':page)};
function numericAnswer(s){s=String(s).trim();if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return Number(s);const m=/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/.exec(s);return m&&+m[2]!==0?+m[1]/+m[2]:NaN;}
const langSwitch=$('#lang').onclick;$('#lang').onclick=()=>{let done=page==='play'&&session&&session.done;langSwitch();if(done&&session&&session.question){const q=session.question;$('#feedback').innerHTML=`<div class="note"><p>${T('Answer','జవాబు')}: ${E(q.answer)}</p><p>${E(explain(q))}</p></div><button id="next" class="primary">${T('Next question','తరువాతి ప్రశ్న')}</button>`;$('#next').onclick=next;if($('#answer'))$('#answer').disabled=true;if($('#submit'))$('#submit').disabled=true;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true)}};

function lessonActivity(id){

  let step=0;const steps=[['Draw segment AB of length4 cm.','AB=4 సెం.మీ. రేఖాఖండం గీయండి.'],['Erect a perpendicular at A and another at B, on the same side of AB.','ABకు ఒకే వైపు A,Bల వద్ద లంబరేఖలు గీయండి.'],['Using the compass or ruler, mark AD=BC=4 cm along those perpendiculars.','ఆ లంబరేఖలపై దిక్సూచి లేదా స్కేలుతో AD=BC=4 సెం.మీ. గుర్తించండి.'],['Join D to C. Check four equal sides and four right angles.','D,Cలను కలపండి. నాలుగు సమాన భుజాలు, నాలుగు లంబకోణాలు తనిఖీ చేయండి.']];

 }else box.remove();

}else if(id==='grouped-statistics'){

 const draw=()=>{let f=[0,1,2].map(i=>Number($('#freq-'+i).value));if(f.some((v,i)=>$('#freq-'+i).value===''||!Number.isInteger(v)||v<0||v>20)){$('#grouped-summary').textContent=T('Enter whole frequencies from 0 to 20.','0 నుంచి 20 మధ్య పూర్ణ పౌనఃపున్యాలు ఇవ్వండి.');return}let products=f.map((v,i)=>v*(5+i*10)),n=f.reduce((a,b)=>a+b,0),sum=products.reduce((a,b)=>a+b,0);products.forEach((v,i)=>$('#product-'+i).textContent=v);$('#grouped-summary').textContent=n?`${T('Estimated mean','అంచనా సగటు')} = ${sum}/${n} ≈ ${(sum/n).toFixed(2)}`:T('No observations: mean is undefined.','పరిశీలనలు లేవు: సగటు నిర్వచించబడదు.')};[0,1,2].forEach(i=>$('#freq-'+i).oninput=draw);draw();

});
}else if(id==='trig-identity'){
 box.innerHTML=`<h2>${T('Follow the proof','నిరూపణ చూడండి')}</h2><ol class="proof-steps"><li>${T('Take a right triangle with legs a,b and hypotenuse c>0.','లంబభుజాలు a,b; కర్ణం c>0 గల లంబకోణ త్రిభుజం తీసుకోండి.')}<br>a²+b²=c²</li><li>${T('Divide all terms by c².','అన్ని పదాలను c²తో భాగించండి.')}<br>a²/c² + b²/c² = 1</li><li>${T('For the selected acute angle, a/c=sin θ and b/c=cos θ.','ఎంచుకున్న అల్ప కోణానికి a/c=sin θ,b/c=cos θ.')}<br>sin²θ+cos²θ=1</li></ol><label for="identity-triangle">${T('Check a numeric example','సంఖ్యల ఉదాహరణ తనిఖీ')}</label><select id="identity-triangle"><option value="0">3,4,5</option><option value="1">5,12,13</option><option value="2">8,15,17</option></select><output id="identity-example" aria-live="polite"></output>`;const draw=()=>{const [a,b,c]=[[3,4,5],[5,12,13],[8,15,17]][+$('#identity-triangle').value];$('#identity-example').textContent=`(${a}/${c})² + (${b}/${c})² = ${a*a}/${c*c} + ${b*b}/${c*c} = ${c*c}/${c*c} = 1`};$('#identity-triangle').onchange=draw;draw();

function groupedAndTangentsLab(id){
 if(!['grouped-median','grouped-mode','circle-tangents'].includes(id))return;
 const box=document.createElement('section');box.className='card math-lab';box.id='r6-lab';document.querySelector('.worked').insertAdjacentElement('afterend',box);
 if(id.startsWith('grouped-')){
  const isMedian=id==='grouped-median',initial=isMedian?[2,6,2]:[2,8,4];
  box.innerHTML=`<h2>${isMedian?T('Find the middle','మధ్యగతం కనుక్కోండి'):T('Find the modal class','బాహుళక తరగతి కనుక్కోండి')}</h2><p>${T('The continuous intervals have equal width 10. Each includes its left endpoint and excludes its right endpoint. Set whole frequencies from 0 to 20.','ఈ అవిచ్ఛిన్న అంతరాల వెడల్పు సమానంగా 10. ఎడమ చివర విలువ చేరుతుంది; కుడి చివర విలువ చేరదు. 0 నుంచి 20 మధ్య పూర్ణ పౌనఃపున్యాలు ఇవ్వండి.')}</p><div class="tablewrap"><table><thead><tr><th>${T('Interval','అంతరం')}</th><th>f</th><th><abbr title="${T('Cumulative frequency','సంచిత పౌనఃపున్యం')}">CF</abbr></th></tr></thead><tbody>${initial.map((f,i)=>`<tr><td>[${10*i},${10*i+10})</td><td><label class="sr-label" for="r6-f-${i}">${T('Frequency','పౌనఃపున్యం')} ${i+1}</label><input id="r6-f-${i}" type="number" min="0" max="20" step="1" value="${f}" inputmode="numeric"></td><td id="r6-cf-${i}"></td></tr>`).join('')}</tbody></table></div><p>${T('CF means cumulative frequency. Highlighted row is the class used in the estimate.','CF అంటే సంచిత పౌనఃపున్యం. ప్రత్యేక రంగులో ఉన్న వరుస అంచనాలో వాడే తరగతి.')}</p><output id="r6-answer" aria-live="polite"></output><p>${T('This estimates a value from grouped data; the exact median or mode of the unknown original observations is not recovered.','వర్గీకృత దత్తాంశం నుంచి ఇది అంచనా విలువ మాత్రమే. తెలియని అసలు పరిశీలనల ఖచ్చిత మధ్యగతం లేదా బాహుళకాన్ని తిరిగి పొందలేం.')}</p>`;
  const draw=()=>{let vals=[0,1,2].map(i=>Number($('#r6-f-'+i).value)),out=$('#r6-answer'),cells=[...box.querySelectorAll('tbody tr')];cells.forEach(c=>{c.style.background='';c.style.boxShadow=''});[0,1,2].forEach(i=>$('#r6-cf-'+i).textContent='–');
   if(vals.some((v,i)=>$('#r6-f-'+i).value===''||!Number.isInteger(v)||v<0||v>20)){out.textContent=T('Enter whole frequencies from 0 to 20.','0 నుంచి 20 మధ్య పూర్ణ పౌనఃపున్యాలు ఇవ్వండి.');return}
   let n=vals.reduce((a,b)=>a+b,0),cf=0;vals.forEach((v,i)=>{$('#r6-cf-'+i).textContent=cf+=v});
   if(!n){out.textContent=T('No observations: the estimate is undefined.','పరిశీలనలు లేవు: అంచనా నిర్వచించబడదు.');return}
   if(isMedian){let sum=0,index=vals.findIndex(v=>(sum+=v)>=n/2),c=vals.slice(0,index).reduce((a,b)=>a+b,0),f=vals[index],L=index*10,result=L+(n/2-c)/f*10;cells[index].style.background='color-mix(in srgb, var(--panel) 85%, #16846c 15%)';cells[index].style.boxShadow='inset 4px 0 #16846c';out.textContent=`N=${n}; N/2=${n/2}; L=${L}; C=${c}; f=${f}; h=10. ${T('Estimated median','అంచనా మధ్యగతం')} = ${L}+((${n/2}−${c})/${f})×10 ≈ ${result.toFixed(2)}`;

  };[0,1,2].forEach(i=>$('#r6-f-'+i).oninput=draw);draw();
 }else{
  box.innerHTML=`<h2>${T('Why the tangent lengths match','స్పర్శరేఖాఖండాల పొడవులు ఎందుకు సమానం?')}</h2><svg viewBox="0 0 360 230" role="img" aria-label="${T('Circle centre O, external point P, tangent points A and B','కేంద్రం O గల వృత్తం, బాహ్య బిందువు P, స్పర్శబిందువులు A,B')}"><circle cx="150" cy="115" r="62" fill="#f3e8ff" stroke="#8a41bb" stroke-width="3"/><path d="M150 115 L181 61.31 L274 115 L181 168.69 Z" fill="#d9f6ef" fill-opacity=".5" stroke="#188c7a" stroke-width="2"/><path d="M181 61.31 L274 115 L181 168.69 M150 115 L274 115" fill="none" stroke="#274c85" stroke-width="3"/><g fill="#153f62"><text x="130" y="119">O</text><text x="281" y="121">P</text><text x="178" y="49">A</text><text x="178" y="192">B</text></g></svg><p>${T('Schematic. OA⊥PA and OB⊥PB. PA and PB touch the same circle at exactly one point each.','సూచన బొమ్మ. OA⊥PA,OB⊥PB. PA,PB ఒకే వృత్తాన్ని ఒక్కో స్పర్శబిందువు వద్ద తాకుతాయి.')}</p><ol><li>${T('OA=OB because both are radii.','OA,OB వ్యాసార్థాలు కాబట్టి సమానం.')}</li><li>PA²=OP²−OA²; PB²=OP²−OB².</li><li>${T('Therefore PA²=PB². Lengths are nonnegative, so PA=PB.','అందువల్ల PA²=PB². పొడవులు రుణం కావు కాబట్టి PA=PB.')}</li></ol><label for="tangent-example">${T('Check a numeric example','సంఖ్యల ఉదాహరణ తనిఖీ')}</label><select id="tangent-example"><option value="0">r=3, OP=5</option><option value="1">r=5, OP=13</option><option value="2">r=8, OP=17</option></select><output id="tangent-values" aria-live="polite"></output><p>${T('The radius-perpendicular-to-tangent theorem is assumed here. This is a proof of equal lengths using that theorem, not a proof of the perpendicular theorem itself.','వ్యాసార్థం–స్పర్శరేఖ లంబ సిద్ధాంతాన్ని ఇక్కడ తెలిసినదిగా తీసుకున్నాం. దాన్ని వాడి సమాన పొడవుల నిరూపణ ఇది; ఆ లంబ సిద్ధాంతాన్నే నిరూపించడం కాదు.')}</p>`;
  const draw=()=>{let [r,d]=[[3,5],[5,13],[8,17]][+$('#tangent-example').value],a=Math.sqrt(d*d-r*r);$('#tangent-values').textContent=`PA=PB=√(${d}²−${r}²)=√${d*d-r*r}=${a}`};$('#tangent-example').onchange=draw;draw();
 }

 const draw=()=>{const a=+$('#eq-a').value,b=+$('#eq-b').value,x=+$('#eq-x').value,c=a*x+b;$('#equation-steps').innerHTML=`<ol><li>${a}x + (${b}) = ${c}</li><li>${T('Subtract b from both sides','రెండు వైపులా b తీసివేయండి')}: ${a}x = ${c}−(${b}) = ${a*x}</li><li>${T('Divide both sides by a','రెండు వైపులా aతో భాగించండి')}: x = ${a*x}/${a} = ${x}</li><li>${T('Check','తనిఖీ')}: ${a}×(${x})+(${b}) = ${c}</li></ol>`;$('#eq-feedback').textContent=''};['eq-a','eq-b','eq-x'].forEach(k=>$('#'+k).oninput=draw);$('#eq-check').onclick=()=>{let raw=$('#eq-try').value.replace(/[౦-౯]/g,c=>String(c.charCodeAt(0)-0x0C66)),v=numericAnswer(raw),a=+$('#eq-a').value,b=+$('#eq-b').value,c=a*(+$('#eq-x').value)+b;$('#eq-feedback').textContent=!Number.isFinite(v)?T('Enter a number or fraction.','సంఖ్య లేదా భిన్నం ఇవ్వండి.'):Math.abs(a*v+b-c)<1e-8?T(`Correct: ${a}×(${v})+(${b})=${c}.`,`సరైనది: ${a}×(${v})+(${b})=${c}.`):T(`Substitution gives ${a*v+b}, not ${c}. Try undoing +(${b}) first.`,`ప్రతిక్షేపణలో ${a*v+b} వచ్చింది;${c} కాదు. ముందుగా +(${b})ను రద్దు చేయండి.`)};draw();
 }else if(id==='coordinate-geometry'){
 box.innerHTML=`<h2>${T('Find the point on the grid','గ్రిడ్‌లో బిందువు కనుక్కోండి')}</h2><p>${T('An ordered pair is (x,y). Move horizontally from the origin by x, then vertically by y. Both axes use the same scale.','క్రమయుగ్మం (x,y). మూలబిందువు నుంచి x మేర అడ్డంగా,తర్వాత y మేర నిలువుగా కదలండి. రెండు అక్షాల ప్రమాణం ఒకటే.')}</p><svg id="coordinate-grid" viewBox="0 0 340 340" role="img" aria-label="${T('Coordinate grid from minus five to five on both axes','రెండు అక్షాలపై రుణ ఐదు నుంచి ఐదు వరకు నిరూపక గ్రిడ్')}"></svg><label for="coord-x">x</label><input id="coord-x" type="range" min="-5" max="5" value="3"><label for="coord-y">y</label><input id="coord-y" type="range" min="-5" max="5" value="2"><output id="coordinate-answer" aria-live="polite"></output><p>${T('At x=0 the point is on the y-axis; at y=0 it is on the x-axis. (0,0) is the origin.','x=0 అయితే బిందువు y-అక్షంపై;y=0 అయితే x-అక్షంపై ఉంటుంది. (0,0) మూలబిందువు.')}</p><label for="coordinate-guess">${T('Current x-coordinate?','ప్రస్తుత x-నిరూపకం?')}</label><input id="coordinate-guess" type="text" inputmode="text" maxlength="20"><button id="coordinate-check">${T('Check','తనిఖీ')}</button><p id="coordinate-feedback" role="status"></p>`;
 const draw=()=>{const x=+$('#coord-x').value,y=+$('#coord-y').value,px=n=>170+28*n,py=n=>170-28*n;let grid=Array.from({length:11},(_,i)=>{let n=i-5;return `<line x1="${px(n)}" y1="30" x2="${px(n)}" y2="310" stroke="#c6d6e8"/><line x1="30" y1="${py(n)}" x2="310" y2="${py(n)}" stroke="#c6d6e8"/>${n!==0?`<text x="${px(n)}" y="186" text-anchor="middle" font-size="12">${n}</text><text x="150" y="${py(n)+4}" font-size="12">${n}</text>`:''}`}).join('');$('#coordinate-grid').innerHTML=grid+`<line x1="25" y1="170" x2="320" y2="170" stroke="#23476d" stroke-width="2"/><line x1="170" y1="20" x2="170" y2="315" stroke="#23476d" stroke-width="2"/><text x="322" y="166">x</text><text x="178" y="20">y</text><text x="157" y="187" font-size="12">0</text><path d="M170 170 H${px(x)} V${py(y)}" fill="none" stroke="#ad7040" stroke-width="3" stroke-dasharray="4 4"/><circle id="coordinate-point" cx="${px(x)}" cy="${py(y)}" r="6" fill="#8c43ba"/>`;let where=x===0&&y===0?T('Origin','మూలబిందువు'):x===0?T('y-axis','y-అక్షం'):y===0?T('x-axis','x-అక్షం'):T('Quadrant','చతుర్భాగం')+' '+(x>0?(y>0?'I':'IV'):(y>0?'II':'III'));$('#coordinate-answer').textContent=`P=(${x},${y}) · ${where}`;$('#coordinate-feedback').textContent=''};$('#coord-x').oninput=draw;$('#coord-y').oninput=draw;$('#coordinate-check').onclick=()=>{const v=numericAnswer($('#coordinate-guess').value.replace(/[౦-౯]/g,c=>String(c.charCodeAt(0)-0x0C66)));$('#coordinate-feedback').textContent=v===+$('#coord-x').value?T('Correct. x is the horizontal coordinate.','సరైనది. x అడ్డ నిరూపకం.'):T('Read the horizontal coordinate first. Try again.','ముందుగా అడ్డ నిరూపకం చదవండి. మళ్లీ ప్రయత్నించండి.')};draw();
 }else if(id==='powers'){
 box.innerHTML=`<h2>${T('Multiply powers of the same base','ఒకే భూమి గల ఘాతాలను గుణించండి')}</h2><p>${T('For positive whole-number exponents, aᵐ×aⁿ=aᵐ⁺ⁿ because all factors have the same base. This does not mean adding the exponents for aᵐ+aⁿ.','ధన పూర్ణ ఘాతాంకాలకు aᵐ×aⁿ=aᵐ⁺ⁿ. అన్ని కారణాంకాల భూమి ఒకటే కాబట్టి ఇలా వస్తుంది. aᵐ+aⁿలో కూడా ఘాతాంకాలు కలపవచ్చని దీని అర్థం కాదు.')}</p>${[['power-base',2,5,2,'Base a','భూమి a'],['power-m',1,4,2,'Exponent m','ఘాతాంకం m'],['power-n',1,4,3,'Exponent n','ఘాతాంకం n']].map(([k,min,max,v,en,te])=>`<label for="${k}">${T(en,te)}</label><input id="${k}" type="range" min="${min}" max="${max}" value="${v}">`).join('')}<output id="power-steps" aria-live="polite"></output><p>${T('The activity uses positive integer exponents only. Zero/negative/rational exponent laws need separate definitions and conditions.','ఈ ప్రదర్శన ధన పూర్ణ ఘాతాంకాలకు మాత్రమే. సున్నా,రుణ,భిన్న ఘాతాంకాలకు వేరు నిర్వచనాలు,షరతులు అవసరం.')}</p>`;

 const draw=()=>{let a=+$('#ap-first').value,d=+$('#ap-difference').value,n=+$('#ap-count').value,terms=Array.from({length:n},(_,i)=>a+i*d),last=terms.at(-1),sum=terms.reduce((a,b)=>a+b,0);$('#ap-steps').innerHTML=`<p>${terms.join(', ')}</p><p>a<sub>${n}</sub>=${a}+(${n}−1)×(${d})=${last}</p>${chosenClass>=10?`<p>S<sub>${n}</sub>=${n}/2×(${a}+(${last}))=${sum}</p><p>${T('Check by adding all terms','అన్ని పదాలు కలిపి తనిఖీ')}: ${terms.map(t=>'('+t+')').join('+')}=${sum}</p>`:''}`};['ap-first','ap-difference','ap-count'].forEach(k=>$('#'+k).oninput=draw);draw();
 }

 const box=document.createElement('section');box.id='primary-measure-lab';box.className='card math-lab';document.querySelector('.worked').insertAdjacentElement('afterend',box);

ts, equivalent lengths and comparison. Common-denominator operations appear in the Class6+ view.','ఈ ప్రదర్శన సమాన భాగాలు,సమాన పొడవులు,పోలికలను పరిచయం చేస్తుంది. ఉమ్మడి హారం క్రియలు తరగతి6 నుంచి చూపుతాం.')}</p>`}`;

వద్దు. ప్రతి ఆకారం 360° తర్వాత అతుకుతుంది. ప్రత్యేక భ్రమణ సౌష్టవానికి 0°,360° మధ్యలోనూ అతికే కోణం కావాలి. ప్రతిబింబం,భ్రమణం వేర్వేరు పరీక్షలు.')}</p>`;

 const draw=()=>{let x=+$('#area-x').value,a=+$('#area-a').value,b=+$('#area-b').value,k=Math.min(270/(a+b),170/x),w=(a+b)*k,h=x*k;['x','a','b'].forEach(q=>$('#area-'+q+'-label').textContent=$('#area-'+q).value);$('#distributive-diagram').innerHTML=`<rect id="area-first" x="45" y="40" width="${a*k}" height="${h}" fill="#c4a3e4" stroke="#244b70" stroke-width="2"/><rect id="area-second" x="${45+a*k}" y="40" width="${b*k}" height="${h}" fill="#9bd8c5" stroke="#244b70" stroke-width="2"/><text x="${45+a*k/2}" y="26" text-anchor="middle" font-size="16">a=${a}</text><text x="${45+(a+b/2)*k}" y="26" text-anchor="middle" font-size="16">b=${b}</text><text x="5" y="${45+h/2}" font-size="16">x=${x}</text><text x="${45+a*k/2}" y="${45+h/2}" text-anchor="middle" font-size="18">ax</text><text x="${45+(a+b/2)*k}" y="${45+h/2}" text-anchor="middle" font-size="18">bx</text><text x="${45+w/2}" y="${65+h}" text-anchor="middle" font-size="16">a+b=${a+b}</text>`;$('#distributive-result').textContent=`${a}x+${b}x=(${a}+${b})x=${a+b}x. x=${x}: ${a*x}+${b*x}=${(a+b)*x}.`;$('#area-feedback').textContent=''};['x','a','b'].forEach(q=>$('#area-'+q).oninput=draw);$('#area-check').onclick=()=>{let v=numericAnswer($('#area-guess').value.replace(/[౦-౯]/g,c=>String(c.charCodeAt(0)-0x0C66))),want=(+$('#area-a').value+(+$('#area-b').value))*(+$('#area-x').value);$('#area-feedback').textContent=v===want?T('Correct. Add the two areas or use the full width times height.','సరైనది. రెండు వైశాల్యాలు కలపండి లేదా మొత్తం వెడల్పును ఎత్తుతో గుణించండి.'):T('Use (a+b)×x and count square units.','(a+b)×x వాడి చదరపు ప్రమాణాలు లెక్కించండి.')};draw();
 }else{

ge" min="1" max="4" value="2"><output id="section-result" aria-live="polite"></output><p>${T('For PS:SQ=m:n,the fraction of the way from P to Q is m/(m+n). Therefore S=P+[m/(m+n)](Q−P),or ((nx₁+mx₂)/(m+n),(ny₁+my₂)/(m+n)). Only positive internal ratios are shown;external division is not covered.','PS:SQ=m:n అయితే P నుంచి Q వరకు వెళ్లే భాగం m/(m+n). అందువల్ల S=P+[m/(m+n)](Q−P),లేదా ((nx₁+mx₂)/(m+n),(ny₁+my₂)/(m+n)). ధన అంతర నిష్పత్తులు మాత్రమే చూపుతున్నాం;బాహ్య విభజన ఇక్కడ లేదు.')}</p>`:''}<label for="midpoint-guess">${T('Enter the x-coordinate of midpoint M','M మధ్యబిందువు x-నిరూపకం ఇవ్వండి')}</label><input id="midpoint-guess" type="text" inputmode="text" maxlength="30"><button id="midpoint-check">${T('Check','తనిఖీ')}</button><p id="midpoint-feedback" role="status"></p>`;
 const draw=()=>{const [x1,y1,x2,y2]=['px','py','qx','qy'].map(k=>+$('#distance-'+k).value),X=x=>170+x*30,Y=y=>170-y*30,dx=x2-x1,dy=y2-y1,D=dx*dx+dy*dy,mx=(x1+x2)/2,my=(y1+y2)/2;['px','py','qx','qy'].forEach(k=>$('#distance-'+k+'-label').textContent=$('#distance-'+k).value);let grid=Array.from({length:9},(_,i)=>{let n=i-4;return `<line x1="${X(n)}" y1="50" x2="${X(n)}" y2="290" stroke="#c6d7e7"/><line x1="50" y1="${Y(n)}" x2="290" y2="${Y(n)}" stroke="#c6d7e7"/>${n!==0?`<text x="${X(n)}" y="187" font-size="12" text-anchor="middle">${n}</text><text x="150" y="${Y(n)+4}" font-size="12">${n}</text>`:''}`}).join('');const point=(id,x,y,color,label,offset)=>`<circle id="${id}" cx="${X(x)}" cy="${Y(y)}" r="5" fill="${color}"/><text x="${X(x)+8}" y="${Y(y)+offset}" font-size="14" fill="${color}">${label}</text>`;$('#distance-grid').innerHTML=grid+`<line x1="40" y1="170" x2="300" y2="170" stroke="#234b70"/><line x1="170" y1="40" x2="170" y2="300" stroke="#234b70"/><text x="302" y="166" font-size="14">x</text><text x="177" y="35" font-size="14">y</text><path d="M${X(x1)} ${Y(y1)} H${X(x2)} V${Y(y2)}" fill="none" stroke="#b47a39" stroke-dasharray="4 4" stroke-width="2"/><line id="distance-segment" x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="#7051a4" stroke-width="3"/>`+point('point-p',x1,y1,'#146b9c','P',-8)+point('point-q',x2,y2,'#087b60','Q',18)+point('point-mid',mx,my,'#9b378c','M',-10);$('#distance-result').textContent=`P=(${x1},${y1}),Q=(${x2},${y2}). Δx=${dx},Δy=${dy}. PQ²=(${dx})²+(${dy})²=${D}. PQ=√${D}`+(Number.isInteger(Math.sqrt(D))?`=${Math.sqrt(D)}`:`≈${Math.sqrt(D).toFixed(3)}`)+`. M=((${x1}+(${x2}))/2,(${y1}+(${y2}))/2)=(${mx},${my}).`;if(chosenClass>=10){let m=+$('#section-m').value,n=+$('#section-n').value,sx=(n*x1+m*x2)/(m+n),sy=(n*y1+m*y2)/(m+n);$('#distance-grid').insertAdjacentHTML('beforeend',point('point-section',sx,sy,'#b06118','S',22));$('#section-result').textContent=`PS:SQ=${m}:${n}. S=((${n}×(${x1})+${m}×(${x2}))/(${m}+${n}),(${n}×(${y1})+${m}×(${y2}))/(${m}+${n})). `+T('Coordinates,rounded','ఉజ్జాయింపు నిరూపకాలు')+`≈(${sx.toFixed(3)},${sy.toFixed(3)}). `+(D===0?T('P=Q:the ratio of two zero segment lengths is undefined;all computed points coincide.','P=Q:రెండు సున్నా రేఖాఖండాల నిష్పత్తి నిర్వచించబడదు;లెక్కించిన బిందువులన్నీ ఒకటే.'):T('The exact fractional expressions are shown above.','ఖచ్చిత భిన్న సమాసాలు పైన ఉన్నాయి.'))}$('#midpoint-feedback').textContent=''};['px','py','qx','qy'].forEach(k=>$('#distance-'+k).oninput=draw);if(chosenClass>=10){$('#section-m').oninput=draw;$('#section-n').oninput=draw}$('#midpoint-check').onclick=()=>{let v=numericAnswer($('#midpoint-guess').value.replace(/[౦-౯]/g,c=>String(c.charCodeAt(0)-0x0C66))),want=(+$('#distance-px').value+(+$('#distance-qx').value))/2;$('#midpoint-feedback').textContent=Number.isFinite(v)&&Math.abs(v-want)<1e-8?T('Correct. Average the two x-coordinates.','సరైనది. రెండు x-నిరూపకాల సగటు తీసుకోండి.'):T('Add the two x-coordinates and divide by2.','రెండు x-నిరూపకాలు కలిపి2తో భాగించండి.')};draw();

// Original linear-equation teaching. Coefficients describe ax+by=c,not ax+by+c=0.
const LINE_MODELS=[{a:1,b:1,c:4},{a:1,b:-1,c:0},{a:2,b:2,c:8},{a:1,b:1,c:6},{a:1,b:0,c:2},{a:0,b:1,c:-1},{a:3,b:-1,c:6},{a:3,b:-2,c:15}];
function linePairFacts(p,q){const d=p.a*q.b-q.a*p.b,nx=p.c*q.b-q.c*p.b,ny=p.a*q.c-q.a*p.c;return d?{kind:'one',d,nx,ny,x:nx/d,y:ny/d}:{kind:nx===0&&ny===0?'many':'none',d,nx,ny}}
function lineWindowEnds(l){let pts=[];const add=(x,y)=>{if(x>=-5-1e-9&&x<=5+1e-9&&y>=-5-1e-9&&y<=5+1e-9&&!pts.some(p=>Math.hypot(p.x-x,p.y-y)<1e-8))pts.push({x,y})};if(l.b)for(const x of [-5,5])add(x,(l.c-l.a*x)/l.b);if(l.a)for(const y of [-5,5])add((l.c-l.b*y)/l.a,y);return pts}
function lineFraction(n,d){if(d<0){n=-n;d=-d}const gcd=(a,b)=>b?gcd(b,a%b):a;let g=gcd(Math.abs(n),d);n/=g;d/=g;return d===1?String(n):`${n}/${d}`}
function linearPairLab(id){
 if(id!=='equations'||chosenClass<9)return;
 const box=document.createElement('section');box.id='linear-pair-lab';box.className='card math-lab';document.querySelector('.worked').insertAdjacentElement('afterend',box);

 box.innerHTML=`<h2>${T('Where do two equations agree?','రెండు సమీకరణాలు ఎక్కడ కలుస్తాయి?')}</h2><p>${T('Each line is all real ordered pairs satisfying its equation. A solution of the pair must satisfy both equations at once. The square shows only −5 to 5 on each axis;the lines continue beyond it.','ప్రతి రేఖ తన సమీకరణాన్ని తృప్తిపరిచే అన్ని వాస్తవ క్రమయుగ్మాలను చూపుతుంది. జత సాధనం రెండు సమీకరణాలనూ ఒకేసారి తృప్తిపరచాలి. చతురస్రంలో ప్రతి అక్షంపై −5 నుంచి 5 మాత్రమే కనిపిస్తాయి;రేఖలు బయటకూ కొనసాగుతాయి.')}</p>${['a','b'].map((k,i)=>`<label for="line-${k}">${T('Line','రేఖ')} ${i+1} ${i?T('(dashed)','(చుక్కల రేఖ)'):T('(solid)','(నిరంతర రేఖ)')}</label><select id="line-${k}">${LINE_MODELS.map((l,j)=>`<option value="${j}" ${j===i?'selected':''}>${equation(l)}</option>`).join('')}</select>`).join('')}<svg id="pair-grid" viewBox="0 0 360 360" role="img"></svg><p>${T('Solid purple:line1. Dashed orange:line2. Both axes use one unit per grid square.','నిరంతర ఊదా రేఖ:1. చుక్కల నారింజ రేఖ:2. రెండు అక్షాలపై ఒక్కో గడి ఒక్క ప్రమాణం.')}</p><h3>${T('Two sample points per line','ప్రతి రేఖపై రెండు నమూనా బిందువులు')}</h3><div id="line-samples"></div><label for="line-kind">${T('How many common solutions?','ఉమ్మడి సాధనాలు ఎన్ని?')}</label><select id="line-kind"><option value="">${T('Choose','ఎంచుకోండి')}</option><option value="one">${T('Exactly one','ఒక్కటే')}</option><option value="none">${T('None','లేవు')}</option><option value="many">${T('Infinitely many','అనంతం')}</option></select><button id="line-check">${T('Check the relationship','సంబంధం తనిఖీ')}</button><p id="line-feedback" role="status"></p><details id="pair-reason"><summary>${T('Show exact solution and reason','ఖచ్చిత సాధనం,కారణం చూడండి')}</summary><div id="pair-explanation"></div></details><h3>${T('Test an ordered pair','ఒక క్రమయుగ్మం తనిఖీ')}</h3><label for="pair-x">x</label><input id="pair-x" type="text" inputmode="text" maxlength="20" value="2"><label for="pair-y">y</label><input id="pair-y" type="text" inputmode="text" maxlength="20" value="2"><button id="pair-substitute">${T('Substitute in both','రెండింటిలో ప్రతిక్షేపించండి')}</button><p id="pair-feedback" role="status"></p><p>${T('A rounded graph reading is an estimate. The fractions in the reason are exact. Not seeing a crossing inside this window does not prove the lines are parallel. These selected examples do not cover every modelling or algebraic solution method.','గ్రాఫ్ నుంచి చదివిన దశాంశం అంచనా. కారణంలోని భిన్నాలు ఖచ్చితమైనవి. ఈ కిటికీలో ఖండన కనిపించకపోతే రేఖలు సమాంతరాలని అర్థం కాదు. ఈ ఎంపిక ఉదాహరణలు అన్ని సమస్యా నమూనాలు,బీజ సాధన పద్ధతులను కవర్ చేయవు.')}</p>`;
 const draw=()=>{const p=LINE_MODELS[+$('#line-a').value],q=LINE_MODELS[+$('#line-b').value],f=linePairFacts(p,q),px=x=>180+x*28,py=y=>180-y*28;let svg='';for(let n=-5;n<=5;n++){svg+=`<line x1="${px(n)}" y1="40" x2="${px(n)}" y2="320" stroke="#d1ddeb"/><line x1="40" y1="${py(n)}" x2="320" y2="${py(n)}" stroke="#d1ddeb"/>${n?`<text x="${px(n)}" y="197" text-anchor="middle" font-size="11">${n}</text><text x="160" y="${py(n)+4}" font-size="11">${n}</text>`:''}`};svg+='<path d="M35 180H327 M180 33V327" fill="none" stroke="#244865" stroke-width="2"/><text x="334" y="184">x</text><text x="185" y="28">y</text><text x="164" y="197" font-size="11">0</text>';
 [p,q].forEach((l,i)=>{const ends=lineWindowEnds(l);if(ends.length>=2)svg+=`<line id="pair-line-${i+1}" x1="${px(ends[0].x)}" y1="${py(ends[0].y)}" x2="${px(ends[1].x)}" y2="${py(ends[1].y)}" stroke="${i?'#9a4d00':'#7f39b6'}" stroke-width="${i?3:5}" ${i?'stroke-dasharray="7 5"':''}/>`});
 if(f.kind==='one'&&Math.abs(f.x)<=5&&Math.abs(f.y)<=5)svg+=`<circle id="pair-crossing" cx="${px(f.x)}" cy="${py(f.y)}" r="6" fill="#08765e" stroke="#fff" stroke-width="2"/>`;
 $('#pair-grid').innerHTML=svg;$('#pair-grid').setAttribute('aria-label',T(`Line1:${equation(p)};line2:${equation(q)}. Window −5 to 5,one unit per grid square.`,`రేఖ 1:${equation(p)};రేఖ 2:${equation(q)}. −5 నుంచి 5 వరకు,ఒక్కో గడి ఒక ప్రమాణం.`));
 $('#line-samples').innerHTML=[p,q].map((l,i)=>{const pts=l.b?[{x:0,y:lineFraction(l.c,l.b)},{x:1,y:lineFraction(l.c-l.a,l.b)}]:[{x:lineFraction(l.c,l.a),y:0},{x:lineFraction(l.c,l.a),y:1}];return `<p>${T('Line','రేఖ')} ${i+1}: ${pts.map(t=>`(${t.x},${t.y})`).join(' ; ')}<br>${equation(l)}</p>`}).join('');

 const list=k=>Array.from({length:Math.floor(end/k)},(_,i)=>(i+1)*k).join(', ');$('#common-lists').innerHTML=`<p>A: ${list(a)}<br>B: ${list(b)}</p><p>${T(`Only time 0–${end} is drawn. Lists omit0 because we want the next meeting.`,`0–${end} సమయం మాత్రమే చూపాం. తరువాతి కలయిక కావాలి కాబట్టి జాబితాల్లో 0 లేదు.`)} ${f.lcm>end?T('No positive common mark appears in this window. That does not mean the bells never meet.','ఈ కిటికీలో ఉమ్మడి ధన గుర్తు లేదు. గంటలు ఎప్పటికీ కలవవని అర్థం కాదు.'):''}</p>`;
 let common=f.rows.flatMap(r=>Array(r.min).fill(r.p)),all=f.rows.flatMap(r=>Array(r.max).fill(r.p));$('#common-factor-reason').innerHTML=`<p>${a} = ${f.pa.length?f.pa.join(' × '):'1'}<br>${b} = ${f.pb.length?f.pb.join(' × '):'1'}</p><p>${T('HCF uses the smaller count of each prime: it must fit inside both numbers. LCM uses the larger count: it must contain both. A missing prime has count 0.','HCFలో ప్రతి అభాజ్య కారణాంకం తక్కువసార్లు తీసుకుంటాం:అది రెండు సంఖ్యల్లోనూ ఇమడాలి. LCMలో ఎక్కువసార్లు తీసుకుంటాం:అది రెండింటినీ కలిగి ఉండాలి. లేని కారణాంకం లెక్క 0.')}</p>${f.rows.map(r=>`<p class="common-prime-row" data-prime="${r.p}">${T('Prime','అభాజ్య సంఖ్య')} ${r.p}: A ${r.x}, B ${r.y}. ${T('Smaller count','తక్కువ లెక్క')} ${r.min}; ${T('larger count','ఎక్కువ లెక్క')} ${r.max}.</p>`).join('')||`<p>${T('Both numbers are 1;there are no prime factors. HCF=LCM=1.','రెండు సంఖ్యలూ 1;అభాజ్య కారణాంకాలు లేవు. HCF=LCM=1.')}</p>`}<p>HCF = ${common.length?common.join(' × '):'1'} = ${f.hcf}<br>LCM = ${all.length?all.join(' × '):'1'} = ${f.lcm}</p><p>${T('First common positive meeting','మొదటి ఉమ్మడి ధన కలయిక')}: ${f.lcm} ${T('minutes','నిమిషాలు')}. ${f.lcm}/${a}=${f.lcm/a}; ${f.lcm}/${b}=${f.lcm/b}.</p><p>HCF × LCM = ${f.hcf} × ${f.lcm} = ${a*b} = ${a} × ${b}</p><p>${T('For each prime, smaller count+larger count=count in A+count in B. Multiplying prime powers gives the two-number identity.','ప్రతి అభాజ్య కారణాంకానికి తక్కువ లెక్క+ఎక్కువ లెక్క=Aలో లెక్క+Bలో లెక్క. అభాజ్య ఘాతాలను గుణిస్తే రెండు సంఖ్యల నియమం వస్తుంది.')}</p>`;$('#common-feedback').textContent='';$('#common-guess').value='';$('#common-reason').open=false;
 };

// Column regrouping in exact integer hundredths. A and B each represent 0..1 whole.
function decimalDifference(a,b){
 if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||a>100||b<0||b>100||a<b)return null;
 let ones=Math.floor(a/100),tenths=Math.floor(a%100/10),hundredths=a%10;
 const bo=Math.floor(b/100),bt=Math.floor(b%100/10),bh=b%10,steps=[];
 if(hundredths<bh){if(tenths===0){ones--;tenths+=10;steps.push('whole-for-tenths')}tenths--;hundredths+=10;steps.push('tenth-for-hundredths')}
 if(tenths<bt){ones--;tenths+=10;steps.push('whole-for-tenths')}
 return {ones,tenths,hundredths,bo,bt,bh,steps,result:(ones-bo)*100+(tenths-bt)*10+hundredths-bh};
}

// Fixed expression families: no parsing or evaluation of arbitrary text.
function arithmeticExpressionModel(kind,a,b,c){
 if(!['groups','brackets','change'].includes(kind)||![a,b,c].every(Number.isInteger)||a<0||a>10||b<0||b>10||c<0||c>10)return null;
 if(kind==='groups')return {expression:`${a} + ${b} × ${c}`,first:`${b} × ${c}`,middle:`${a} + ${b*c}`,value:a+b*c,other:(a+b)*c,otherExpression:`(${a} + ${b}) × ${c}`};
 if(kind==='brackets')return {expression:`(${a} + ${b}) × ${c}`,first:`${a} + ${b}`,middle:`${a+b} × ${c}`,value:(a+b)*c,other:a+b*c,otherExpression:`${a} + ${b} × ${c}`};
 // Let the amount received be a+2*b+c, so both purchases always fit.
 const paid=a+2*b+c;return {expression:`${paid} − (${b} + ${c})`,first:`${b} + ${c}`,middle:`${paid} − ${b+c}`,value:paid-b-c,other:paid-b+c,otherExpression:`${paid} − ${b} + ${c}`,paid};
}

function largeNumberModel(raw){
 const text=String(raw).trim().replace(/[౦-౯]/g,c=>String(c.charCodeAt(0)-0x0C66));if(!/^\d{1,10}$/.test(text))return null;

 const places=Array.from({length:10},(_,power)=>({power,unit:10**power,digit:Math.floor(value/10**power)%10,amount:(Math.floor(value/10**power)%10)*10**power}));

}

function roundingModel(value,unit){
 if(!Number.isSafeInteger(value)||value<0||value>9999999999||![1000,10000,100000,1000000,10000000].includes(unit))return null;
 const lower=Math.floor(value/unit)*unit,upper=lower+unit,down=value-lower,up=upper-value;

}
function roundingIndian(n){const s=String(n);return s.length<=3?s:s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3)}

function integerDivisionModel(n,d){
 if(!Number.isInteger(n)||!Number.isInteger(d)||Math.abs(n)>36||Math.abs(d)>6)return null;

}

 box.innerHTML=`<h2>${T('Division asks a multiplication question','భాగహారం ఒక గుణకార ప్రశ్న')}</h2><p>${T('n ÷ d asks: which number q makes d × q = n? Use the multiplication relationship, not only a sign rule. An integer divided by another integer need not give an integer.','n ÷ d అంటే: d × q = n అయ్యే q ఏది? గుర్తుల నియమంతో పాటు గుణకార సంబంధాన్ని వాడండి. రెండు పూర్ణ సంఖ్యల భాగఫలం ఎప్పుడూ పూర్ణ సంఖ్య కాదు.')}</p><label for="integer-dividend">n: <span id="integer-dividend-label"></span></label><input id="integer-dividend" type="range" min="-36" max="36" value="-12"><label for="integer-divisor">d: <span id="integer-divisor-label"></span></label><input id="integer-divisor" type="range" min="-6" max="6" value="-3"><p class="number" id="integer-division-question"></p><p id="integer-division-reason"></p><button id="integer-division-reveal">${T('Show the multiplication link','గుణకార సంబంధం చూపు')}</button><div id="integer-division-work" hidden></div><div id="integer-division-answer"><label for="integer-division-guess">${T('Enter q as an integer or a/b fraction','q ను పూర్ణ సంఖ్యగా లేదా a/b భిన్నంగా ఇవ్వండి')}</label><input id="integer-division-guess" type="text" inputmode="text" maxlength="16"><button id="integer-division-check">${T('Check by multiplying','గుణించి తనిఖీ చేయు')}</button></div><p id="integer-division-feedback" role="status"></p><p>${T('A zero divisor has no unique quotient. This model explains the reason and keeps exploring available. It does not award XP or teach every integer property or word problem.','సున్నా భాజకానికి ఏకైక భాగఫలం ఉండదు. ఈ నమూనా కారణాన్ని వివరిస్తుంది; అన్వేషణను ఆపదు. ఇది XP ఇవ్వదు; అన్ని పూర్ణ సంఖ్యల ధర్మాలు, సమస్యలు ఇందులో లేవు.')}</p>`;
 const fmt=n=>n<0?'('+n+')':String(n);
 const draw=()=>{const m=integerDivisionModel(+$('#integer-dividend').value,+$('#integer-divisor').value);$('#integer-dividend-label').textContent=m.n;$('#integer-divisor-label').textContent=m.d;$('#integer-division-question').textContent=fmt(m.n)+' ÷ '+fmt(m.d)+' = ?';$('#integer-division-work').hidden=true;$('#integer-division-feedback').textContent='';$('#integer-division-guess').value='';$('#integer-division-answer').hidden=m.d===0;
 $('#integer-division-reason').textContent=m.kind==='impossible'?T(`0 × q is always 0. It cannot equal ${m.n}. No number solves this equation, so this division is undefined.`,`0 × q ఎప్పుడూ 0. అది ${m.n} కాలేదు. ఈ సమీకరణానికి జవాబు లేదు; ఈ భాగహారం నిర్వచించబడలేదు.`):m.kind==='nonunique'?T('Every number satisfies 0 × q = 0, so there is no single quotient. 0 ÷ 0 is undefined, not 0.','ప్రతి సంఖ్యకూ 0 × q = 0 నిజం. కాబట్టి ఒకే భాగఫలం లేదు. 0 ÷ 0 నిర్వచించబడలేదు; అది 0 కాదు.'):T(`Find q so that ${fmt(m.d)} × q = ${fmt(m.n)}.`,` ${fmt(m.d)} × q = ${fmt(m.n)} అయ్యే q కనుక్కోండి.`);
 $('#integer-division-work').textContent=m.d===0?$('#integer-division-reason').textContent:fmt(m.d)+' × ('+m.text+') = '+fmt(m.n)+'. '+T('Therefore q = ','కాబట్టి q = ')+m.text+'. '+(m.kind==='fraction'?T('This quotient is not an integer. Integers are not closed under division.','ఈ భాగఫలం పూర్ణ సంఖ్య కాదు. భాగహారంలో పూర్ణ సంఖ్యలకు సంవృత ధర్మం లేదు.'):T('This quotient is an integer.','ఈ భాగఫలం పూర్ణ సంఖ్య.'));
 };
 $('#integer-dividend').oninput=draw;$('#integer-divisor').oninput=draw;$('#integer-division-reveal').onclick=()=>{$('#integer-division-work').hidden=!$('#integer-division-work').hidden};
 $('#integer-division-check').onclick=()=>{const m=integerDivisionModel(+$('#integer-dividend').value,+$('#integer-divisor').value);if(!m.d)return;const raw=$('#integer-division-guess').value.trim().replace(/−/g,'-').replace(/[౦-౯]/g,c=>String(c.charCodeAt(0)-0x0C66)),match=/^(-?\d{1,3})(?:\/(-?\d{1,3}))?$/.exec(raw),a=match?Number(match[1]):NaN,b=match?Number(match[2]||1):0;$('#integer-division-feedback').textContent=!Number.isInteger(a)||!b?T('Enter an integer or a fraction with a nonzero denominator, such as -3/2.','పూర్ణ సంఖ్య లేదా -3/2 వంటి భిన్నం ఇవ్వండి. హారం సున్నా కాకూడదు.'):m.d*a===m.n*b?T('Correct. Multiplying the divisor by your quotient gives the dividend.','సరైనది. భాజకాన్ని మీ భాగఫలంతో గుణిస్తే భాజ్యం వస్తుంది.'):T('Try again. Multiply the divisor by your answer and compare it with the dividend.','మళ్లీ ప్రయత్నించండి. భాజకాన్ని మీ జవాబుతో గుణించి భాజ్యంతో పోల్చండి.')};draw();
}
