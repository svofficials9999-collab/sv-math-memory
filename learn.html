const LESSONS=[{"topic":"number-recognition","minClass":1,"maxClass":2,"en":"Numbers and counting","te":"సంఖ్యలు, లెక్కింపు","idea":"Count each object once. Zero means no objects.","ideaTe":"ప్రతి వస్తువును ఒక్కసారి లెక్కించండి. వస్తువులు లేకపోతే సున్నా.","example":"4 objects and 1 more make 5.","exampleTe":"4 వస్తువులకు మరొకటి కలిపితే 5.","watch":"Do not count the same object twice.","watchTe":"ఒకే వస్తువును రెండుసార్లు లెక్కించవద్దు."},{"topic":"addition","minClass":1,"maxClass":3,"en":"Addition","te":"కూడిక","idea":"Join quantities. Count on from the first number.","ideaTe":"పరిమాణాలను కలపండి. మొదటి సంఖ్య నుంచి ముందుకు లెక్కించండి.","example":"18 + 7 = 25. Check: 25 − 7 = 18.","exampleTe":"18 + 7 = 25. తనిఖీ: 25 − 7 = 18.","watch":"Line up ones with ones, tens with tens.","watchTe":"ఒకట్లను ఒకట్ల కింద, పదులను పదుల కింద రాయండి."},{"topic":"subtraction","minClass":1,"maxClass":3,"en":"Subtraction","te":"తీసివేత","idea":"Find what remains or the difference.","ideaTe":"మిగిలిన పరిమాణం లేదా తేడా కనుగొనండి.","example":"32 − 7 = 25. Check: 25 + 7 = 32.","exampleTe":"32 − 7 = 25. తనిఖీ: 25 + 7 = 32.","watch":"Changing the order changes the result.","watchTe":"సంఖ్యల క్రమం మార్చితే ఫలితం మారుతుంది."},{"topic":"patterns","minClass":1,"maxClass":10,"en":"Number patterns","te":"సంఖ్యల క్రమాలు","idea":"Find the change between neighbouring terms. Test it with all the terms.","ideaTe":"పక్కపక్క సంఖ్యల మధ్య మార్పు గుర్తించండి. అన్ని సంఖ్యలతో తనిఖీ చేయండి.","example":"2, 5, 8, 11: add 3 each time.","exampleTe":"2, 5, 8, 11: ప్రతిసారీ 3 కలపండి.","watch":"One example alone may fit many rules.","watchTe":"ఒక్క ఉదాహరణకే ఎన్నో నియమాలు సరిపోవచ్చు."},{"topic":"place-value","minClass":2,"maxClass":6,"en":"Place value","te":"స్థాన విలువ","idea":"From right: ones, tens, hundreds. Ten ones make one ten.","ideaTe":"కుడి నుంచి ఒకట్లు, పదులు, వందలు. పది ఒకట్లు ఒక పది.","example":"347 = 300 + 40 + 7.","exampleTe":"347 = 300 + 40 + 7. ఇందులో 4 విలువ 40.","watch":"A digit and its place value are different.","watchTe":"అంకె, దాని స్థాన విలువ వేర్వేరు."},{"topic":"multiplication","minClass":3,"maxClass":10,"en":"Multiplication","te":"గుణకారం","idea":"Multiply to count equal groups.","ideaTe":"సమాన గుంపుల మొత్తానికి గుణకారం చేయండి.","example":"4 groups of 3: 4 × 3 = 12.","exampleTe":"3 వస్తువులున్న 4 గుంపులు: 4 × 3 = 12.","watch":"The groups must have equal size.","watchTe":"అన్ని గుంపుల్లో వస్తువుల సంఖ్య సమానంగా ఉండాలి."},{"topic":"division","minClass":3,"maxClass":10,"en":"Division","te":"భాగహారం","idea":"Share equally. Dividend = divisor × quotient + remainder.","ideaTe":"సమానంగా పంచండి. భాజ్యం = భాజకం × భాగఫలం + శేషం.","example":"17 ÷ 5: quotient 3, remainder 2. 5 × 3 + 2 = 17.","exampleTe":"17ను 5తో భాగిస్తే భాగఫలం 3, శేషం 2. 5 × 3 + 2 = 17.","watch":"Never divide by zero. Remainder is smaller than a positive divisor.","watchTe":"సున్నాతో భాగించడం నిర్వచించబడదు. శేషం ధన భాజకం కంటే చిన్నదిగా ఉండాలి."},{"topic":"measurement","minClass":3,"maxClass":10,"en":"Measurement","te":"కొలతలు","idea":"Convert to the same units before comparing or adding.","ideaTe":"పోల్చే లేదా కలిపే ముందు ఒకే ప్రమాణంలోకి మార్చండి.","example":"1 m = 100 cm; 2 m 30 cm = 230 cm.","exampleTe":"1 మీటరు = 100 సెంటీమీటర్లు; 2 మీటర్లు 30 సెంటీమీటర్లు = 230 సెంటీమీటర్లు.","watch":"Do not add metres directly to centimetres.","watchTe":"మీటర్లను సెంటీమీటర్లకు నేరుగా కలపవద్దు."},{"topic":"fractions","minClass":4,"maxClass":10,"en":"Fractions","te":"భిన్నాలు","idea":"Denominator: equal parts in a whole. Numerator: parts selected.","ideaTe":"హారం: మొత్తం సమాన భాగాలు. లవం: తీసుకున్న భాగాలు.","example":"3/4 of 20 = (20 ÷ 4) × 3 = 15.","exampleTe":"20లో 3/4 = (20 ÷ 4) × 3 = 15.","watch":"Parts must be equal. Do not add denominators when adding fractions.","watchTe":"భాగాలు సమానంగా ఉండాలి. భిన్నాల కూడికలో హారాలను కలపవద్దు."},{"topic":"geometry","minClass":4,"maxClass":10,"en":"Shapes and angles","te":"ఆకారాలు, కోణాలు","idea":"Triangle: 3 sides. Right angle: 90°. Triangle angles total 180°.","ideaTe":"త్రిభుజానికి 3 భుజాలు. లంబకోణం 90°. త్రిభుజ కోణాల మొత్తం 180°.","example":"Triangle angles 50°, 60°, ?: 180 − 50 − 60 = 70°.","exampleTe":"త్రిభుజ కోణాలు 50°, 60°, ?: 180 − 50 − 60 = 70°.","watch":"A diagram may not be drawn to scale.","watchTe":"బొమ్మ నిజమైన కొలతల నిష్పత్తిలో ఉండకపోవచ్చు."},{"topic":"decimals","minClass":5,"maxClass":10,"en":"Decimals","te":"దశాంశాలు","idea":"After the decimal point: tenths, hundredths, thousandths. Align decimal points.","ideaTe":"దశాంశ బిందువు తరువాత పదవ, నూరవ, వెయ్యవ వంతులు. బిందువులు ఒకదాని కింద ఒకటి రాయండి.","example":"2.35 + 0.40 = 2.75.","exampleTe":"2.35 + 0.40 = 2.75.","watch":"0.5 = 0.50, but 0.5 is not 0.05.","watchTe":"0.5 = 0.50, కానీ 0.5 విలువ 0.05 కాదు."},{"topic":"mensuration","minClass":5,"maxClass":10,"en":"Perimeter and area","te":"చుట్టుకొలత, వైశాల్యం","idea":"Rectangle: perimeter = 2(l+w); area = l × w.","ideaTe":"దీర్ఘచతురస్రం: చుట్టుకొలత = 2(పొడవు+వెడల్పు); వైశాల్యం = పొడవు × వెడల్పు.","example":"6 cm × 4 cm rectangle: area 24 cm², perimeter 20 cm.","exampleTe":"6 సెం.మీ. × 4 సెం.మీ.: వైశాల్యం 24 చ.సెం.మీ., చుట్టుకొలత 20 సెం.మీ.","watch":"Area uses square units; perimeter uses length units.","watchTe":"వైశాల్యానికి చదరపు ప్రమాణాలు; చుట్టుకొలతకు పొడవు ప్రమాణాలు."},{"topic":"factors-multiples","minClass":6,"maxClass":10,"en":"Factors, multiples and HCF","te":"కారణాంకాలు, గుణిజాలు, గ.సా.భా.","idea":"A factor divides exactly. HCF is the greatest shared factor.","ideaTe":"కారణాంకంతో భాగిస్తే శేషం సున్నా. ఉమ్మడి కారణాంకాల్లో అతిపెద్దది గ.సా.భా.","example":"12: factors 1,2,3,4,6,12. 18: factors 1,2,3,6,9,18. HCF = 6.","exampleTe":"12 కారణాంకాలు: 1,2,3,4,6,12. 18 కారణాంకాలు: 1,2,3,6,9,18. గ.సా.భా. = 6.","watch":"HCF cannot exceed either positive number.","watchTe":"ధన సంఖ్యల గ.సా.భా. ఆ రెండు సంఖ్యల్లో ఏదానికంటే పెద్దది కాదు."},{"topic":"lcm","minClass":6,"maxClass":10,"en":"LCM","te":"క.సా.గు.","idea":"The smallest shared positive multiple. For positive integers: LCM = product ÷ HCF.","ideaTe":"అతి చిన్న ఉమ్మడి ధన గుణిజం. ధన పూర్ణ సంఖ్యలకు: క.సా.గు. = లబ్ధం ÷ గ.సా.భా.","example":"Multiples of 4: 4,8,12. Multiples of 6: 6,12. LCM = 12.","exampleTe":"4 గుణిజాలు: 4,8,12. 6 గుణిజాలు: 6,12. క.సా.గు. = 12.","watch":"Product is not always the LCM.","watchTe":"లబ్ధం ఎప్పుడూ కనిష్ఠ సామాన్య గుణిజం కాదు."},{"topic":"ratio","minClass":6,"maxClass":10,"en":"Ratio and proportion","te":"నిష్పత్తి, అనుపాతం","idea":"Compare quantities in the same units. Scale both ratio parts equally.","ideaTe":"ఒకే ప్రమాణంలోని పరిమాణాలను పోల్చండి. నిష్పత్తి భాగాలను ఒకే సంఖ్యతో గుణించండి.","example":"2:3 with total 25: 5 shares of 5; quantities 10 and 15.","exampleTe":"2:3 నిష్పత్తిలో మొత్తం 25: 5 భాగాలు, ఒక్క భాగం 5; పరిమాణాలు 10,15.","watch":"Scale both parts, not just one.","watchTe":"ఒక్క భాగాన్ని కాకుండా రెండు భాగాలనూ మార్చాలి."},{"topic":"algebra","minClass":6,"maxClass":10,"en":"Algebra","te":"బీజగణితం","idea":"A variable represents a number. Substitute, then follow operation order.","ideaTe":"చరరాశి ఒక సంఖ్యకు గుర్తు. విలువ పెట్టి క్రియల క్రమం పాటించండి.","example":"x = 4: 3x + 2 = 3 × 4 + 2 = 14.","exampleTe":"x = 4 అయితే 3x + 2 = 3 × 4 + 2 = 14.","watch":"3x means 3 × x, not 3 + x.","watchTe":"3x అంటే 3 × x; 3 + x కాదు."},{"topic":"equations","minClass":7,"maxClass":10,"en":"Linear equations","te":"రేఖీయ సమీకరణాలు","idea":"An equation is a balance. Do the same operation to both sides.","ideaTe":"సమీకరణం తూకం లాంటిది. రెండు వైపులా ఒకే క్రియ చేయాలి.","example":"3x + 2 = 14 → 3x = 12 → x = 4. Substitute to check.","exampleTe":"3x + 2 = 14 → 3x = 12 → x = 4. విలువ పెట్టి తనిఖీ చేయండి.","watch":"Changing just one side breaks the balance.","watchTe":"ఒక వైపునే మార్చితే సమానత్వం దెబ్బతింటుంది."},{"topic":"percentages","minClass":7,"maxClass":10,"en":"Percentages","te":"శాతాలు","idea":"Percent means per hundred. p% of n = p × n ÷ 100.","ideaTe":"శాతం అంటే ప్రతి వందలో భాగం. nలో p శాతం = p × n ÷ 100.","example":"20% of 150 = 30. After a 20% discount: 150 − 30 = 120.","exampleTe":"150లో 20% = 30. 20% తగ్గింపు తరువాత: 150 − 30 = 120.","watch":"A 20% rise then 20% fall does not cancel out.","watchTe":"20% పెరుగుదల తరువాత 20% తగ్గుదల వస్తే మొదటి విలువ తిరిగి రాదు."},{"topic":"statistics","minClass":6,"maxClass":10,"en":"Data and averages","te":"దత్తాంశం, సగటులు","idea":"Mean = total ÷ count. Median = middle after sorting. Mode = most frequent value.","ideaTe":"సగటు = మొత్తం ÷ సంఖ్యల సంఖ్య. క్రమంలో మధ్యది మధ్యగతం. ఎక్కువసార్లు వచ్చేది బాహుళకం.","example":"2,3,3,8: mean 4, median 3, mode 3.","exampleTe":"2,3,3,8: సగటు 4, మధ్యగతం 3, బాహుళకం 3.","watch":"For even count, median averages the two middle values.","watchTe":"సంఖ్యల సంఖ్య సరి అయితే మధ్య రెండు విలువల సగటు మధ్యగతం."},{"topic":"probability","minClass":8,"maxClass":10,"en":"Probability","te":"సంభావ్యత","idea":"For equally likely outcomes: favourable ÷ total. Probability is from 0 to 1.","ideaTe":"సమాన అవకాశాల ఫలితాలకు: అనుకూల ఫలితాలు ÷ మొత్తం ఫలితాలు. సంభావ్యత 0 నుంచి 1 మధ్య ఉంటుంది.","example":"Fair die, even number: 3/6 = 1/2 = 50%.","exampleTe":"సమాన అవకాశాల పాచిక, సరి సంఖ్య: 3/6 = 1/2 = 50%.","watch":"The formula requires equally likely outcomes.","watchTe":"ఈ సూత్రానికి అన్ని ఫలితాల అవకాశాలు సమానంగా ఉండాలి."},{"topic":"coordinate-geometry","minClass":9,"maxClass":10,"en":"Coordinate geometry","te":"నిరూపక జ్యామితి","idea":"Distance = √((x₂−x₁)²+(y₂−y₁)²). Midpoint averages the coordinates.","ideaTe":"దూరం = √((x₂−x₁)²+(y₂−y₁)²). మధ్యబిందువుకు నిరూపకాల సగటులు తీసుకోండి.","example":"(0,0) to (3,4): √(9+16) = 5.","exampleTe":"(0,0) నుంచి (3,4): √(9+16) = 5.","watch":"(2,5) and (5,2) are different points.","watchTe":"(2,5), (5,2) వేర్వేరు బిందువులు."},{"topic":"trigonometry","minClass":10,"maxClass":10,"en":"Trigonometry","te":"త్రికోణమితి","idea":"Right triangle: sin θ = opposite/hypotenuse; cos θ = adjacent/hypotenuse; tan θ = opposite/adjacent.","ideaTe":"లంబకోణ త్రిభుజం: sin θ = ఎదురుభుజం/కర్ణం; cos θ = ఆసన్నభుజం/కర్ణం; tan θ = ఎదురుభుజం/ఆసన్నభుజం.","example":"Opposite 3, adjacent 4, hypotenuse 5: sin θ = 3/5, cos θ = 4/5, tan θ = 3/4.","exampleTe":"ఎదురుభుజం 3, ఆసన్నభుజం 4, కర్ణం 5: sin θ = 3/5, cos θ = 4/5, tan θ = 3/4.","watch":"Choose the angle first. The opposite side depends on it.","watchTe":"ముందు కోణాన్ని ఎంచుకోండి. దానికి ఎదురుగా ఉన్నది ఎదురుభుజం."},{"topic":"advanced-practice","minClass":10,"maxClass":10,"en":"Identities revision","te":"సర్వసమానతల పునశ్చరణ","idea":"(a+b)² = a²+2ab+b²; a²−b² = (a−b)(a+b).","ideaTe":"(a+b)² = a²+2ab+b²; a²−b² = (a−b)(a+b).","example":"9²−4² = (9−4)(9+4) = 5 × 13 = 65.","exampleTe":"9²−4² = (9−4)(9+4) = 5 × 13 = 65.","watch":"(a+b)² is not a²+b².","watchTe":"(a+b)² విలువ a²+b² కాదు."},{"topic":"money","minClass":2,"maxClass":5,"en":"Money","te":"డబ్బు లెక్కలు","idea":"Add costs. Change = amount paid − total cost.","ideaTe":"ధరలను కలపండి. చిల్లర = ఇచ్చిన మొత్తం − మొత్తం ధర.","example":"Pay ₹50 for an item costing ₹32: change ₹18.","exampleTe":"₹32 వస్తువుకు ₹50 ఇస్తే చిల్లర ₹18.","watch":"Keep rupees and paise in matching units.","watchTe":"రూపాయలు, పైసలను ఒకే ప్రమాణంలోకి మార్చండి."},{"topic":"time","minClass":2,"maxClass":5,"en":"Time and calendars","te":"సమయం, క్యాలెండరు","idea":"60 minutes = 1 hour; 24 hours = 1 day.","ideaTe":"60 నిమిషాలు = 1 గంట; 24 గంటలు = 1 రోజు.","example":"From 2:15 to 3:00 is 45 minutes.","exampleTe":"2:15 నుంచి 3:00 వరకు 45 నిమిషాలు.","watch":"Hours are not groups of 100 minutes.","watchTe":"గంటలో 100 నిమిషాలు ఉండవు."},{"topic":"shapes","minClass":1,"maxClass":3,"en":"Shapes around us","te":"మన చుట్టూ ఆకారాలు","idea":"A triangle has 3 sides; square and rectangle have 4.","ideaTe":"త్రిభుజానికి 3 భుజాలు; చతురస్రం, దీర్ఘచతురస్రానికి 4.","example":"A square has 4 equal sides and 4 right angles.","exampleTe":"చతురస్రానికి 4 సమాన భుజాలు, 4 లంబకోణాలు.","watch":"A circle has no straight sides.","watchTe":"వృత్తానికి సరళ భుజాలు ఉండవు."},{"topic":"data","minClass":2,"maxClass":5,"en":"Reading data","te":"దత్తాంశం చదవడం","idea":"A table or pictograph records counts. Check the key before counting symbols.","ideaTe":"పట్టిక లేదా చిత్రలేఖనం సంఖ్యలను చూపుతుంది. గుర్తుల విలువ ముందుగా చూడండి.","example":"If one symbol means 2 books, 4 symbols mean 8 books.","exampleTe":"ఒక గుర్తు 2 పుస్తకాలను సూచిస్తే 4 గుర్తులు 8 పుస్తకాలు.","watch":"A symbol need not mean one item.","watchTe":"ఒక గుర్తు ఎప్పుడూ ఒక్క వస్తువునే సూచించదు."},{"topic":"integers","minClass":6,"maxClass":8,"en":"Integers","te":"పూర్ణ సంఖ్యలు","idea":"Integers include negatives, zero and positives. On a number line, right is greater.","ideaTe":"పూర్ణ సంఖ్యల్లో రుణ సంఖ్యలు, సున్నా, ధన సంఖ్యలు ఉంటాయి. సంఖ్యారేఖపై కుడివైపు పెద్ద విలువలు.","example":"−3 + 5 = 2; −3 × 5 = −15.","exampleTe":"−3 + 5 = 2; −3 × 5 = −15.","watch":"−8 is less than −2.","watchTe":"−8 విలువ −2 కంటే చిన్నది."},{"topic":"rational-numbers","minClass":7,"maxClass":9,"en":"Rational numbers","te":"p/q రూపంలోని సంఖ్యలు","idea":"A rational number can be written p/q for integers p,q with q ≠ 0.","ideaTe":"p,q పూర్ణ సంఖ్యలు, q ≠ 0 అయితే p/q రూపంలో రాయగలది p/q రూపంలోని సంఖ్య.","example":"1/2 + 1/3 = 3/6 + 2/6 = 5/6.","exampleTe":"1/2 + 1/3 = 3/6 + 2/6 = 5/6.","watch":"Use a common denominator for addition.","watchTe":"కూడికకు ఉమ్మడి హారం తీసుకోండి."},{"topic":"powers","minClass":7,"maxClass":9,"en":"Exponents and powers","te":"ఘాతాలు","idea":"For integer powers of a nonzero base: aᵐ × aⁿ = aᵐ⁺ⁿ.","ideaTe":"సున్నా కాని భూమికి పూర్ణ ఘాతాలు: aᵐ × aⁿ = aᵐ⁺ⁿ.","example":"2³ × 2² = 2⁵ = 32.","exampleTe":"2³ × 2² = 2⁵ = 32.","watch":"Add exponents only when multiplying powers of the same base.","watchTe":"ఒకే భూమి ఘాతాల గుణకారంలోనే ఘాతాలను కలపండి."},{"topic":"roots","minClass":8,"maxClass":10,"en":"Squares and roots","te":"వర్గాలు, వర్గమూలాలు","idea":"The principal square root is nonnegative. Square it to check.","ideaTe":"ప్రధాన వర్గమూలం రుణం కాదు. దాన్ని వర్గం చేసి తనిఖీ చేయండి.","example":"√81 = 9 because 9 × 9 = 81.","exampleTe":"√81 = 9 ఎందుకంటే 9 × 9 = 81.","watch":"Solving x² = 81 gives x = 9 or −9, unlike the single principal root.","watchTe":"x² = 81కు x = 9 లేదా −9. ప్రధాన వర్గమూలం మాత్రం 9."},{"topic":"quadrilaterals","minClass":8,"maxClass":10,"en":"Quadrilaterals","te":"చతుర్భుజాలు","idea":"The interior angles of a simple quadrilateral total 360°.","ideaTe":"సరళ చతుర్భుజ అంతర కోణాల మొత్తం 360°.","example":"Angles 80°,90°,100°,?: 360 − 270 = 90°.","exampleTe":"కోణాలు 80°,90°,100°,?: 360 − 270 = 90°.","watch":"A rectangle need not have four equal sides.","watchTe":"దీర్ఘచతురస్రానికి నాలుగు సమాన భుజాలు ఉండనవసరం లేదు."},{"topic":"volume","minClass":8,"maxClass":10,"en":"Volume and surface area","te":"ఘనపరిమాణం, ఉపరితల వైశాల్యం","idea":"Cuboid volume = lwh. Surface area = 2(lw+wh+hl).","ideaTe":"దీర్ఘఘన ఘనపరిమాణం = పొడవు × వెడల్పు × ఎత్తు. ఉపరితల వైశాల్యం = 2(lw+wh+hl).","example":"Cuboid 2 × 3 × 4 cm: volume 24 cm³; surface area 52 cm².","exampleTe":"2 × 3 × 4 సెం.మీ.: ఘనపరిమాణం 24 ఘ.సెం.మీ.; ఉపరితల వైశాల్యం 52 చ.సెం.మీ.","watch":"Volume uses cubic units, not square units.","watchTe":"ఘనపరిమాణానికి ఘన ప్రమాణాలు, చదరపు ప్రమాణాలు కాదు."},{"topic":"polynomials","minClass":9,"maxClass":10,"en":"Polynomials","te":"బహుపదులు","idea":"Polynomial terms have nonnegative integer powers of the variable.","ideaTe":"బహుపది పదాల్లో చరరాశి ఘాతాలు సున్నా లేదా ధన పూర్ణ సంఖ్యలు.","example":"2x²+3x+1 at x=2 is 8+6+1 = 15.","exampleTe":"x=2 అయితే 2x²+3x+1 = 8+6+1 = 15.","watch":"1/x is not a polynomial in x.","watchTe":"1/x అనేది xలో బహుపది కాదు."},{"topic":"linear-two","minClass":9,"maxClass":10,"en":"Equations in two variables","te":"రెండు చరరాశుల సమీకరణాలు","idea":"A linear equation in x,y describes a line. Check an ordered pair by substitution.","ideaTe":"x,yల రేఖీయ సమీకరణం సరళరేఖను సూచిస్తుంది. విలువలు పెట్టి తనిఖీ చేయండి.","example":"x+y=7, x−y=1. Adding gives 2x=8; x=4,y=3.","exampleTe":"x+y=7, x−y=1. కలిపితే 2x=8; x=4,y=3.","watch":"One equation alone usually has many solution pairs.","watchTe":"ఒక్క సమీకరణానికి సాధారణంగా ఎన్నో పరిష్కార జతలు ఉంటాయి."},{"topic":"quadratic","minClass":10,"maxClass":10,"en":"Quadratic equations","te":"వర్గ సమీకరణాలు","idea":"A quadratic has degree 2. Factorise or use the quadratic formula.","ideaTe":"వర్గ సమీకరణ ఘాతం 2. కారణాంకాలుగా విడగొట్టండి లేదా వర్గ సమీకరణ సూత్రం వాడండి.","example":"x²−5x+6=0 → (x−2)(x−3)=0. Roots 2 and 3.","exampleTe":"x²−5x+6=0 → (x−2)(x−3)=0. మూలాలు 2,3.","watch":"When a product is zero, at least one factor is zero.","watchTe":"లబ్ధం సున్నా అయితే కనీసం ఒక కారణాంకం సున్నా."},{"topic":"progressions","minClass":9,"maxClass":10,"en":"Arithmetic progressions","te":"అంకశ్రేఢులు","idea":"Consecutive terms have the same difference d. aₙ = a+(n−1)d.","ideaTe":"వరుస పదాల మధ్య ఒకే తేడా d ఉంటుంది. aₙ = a+(n−1)d.","example":"3,7,11,...: a=3,d=4; fifth term = 3+4×4 = 19.","exampleTe":"3,7,11,...: a=3,d=4; ఐదవ పదం = 3+4×4 = 19.","watch":"The first term uses n=1, not n=0.","watchTe":"మొదటి పదానికి n=1; n=0 కాదు."},{"topic":"circles","minClass":9,"maxClass":10,"en":"Circles","te":"వృత్తాలు","idea":"Diameter = 2r. Circumference = 2πr. Area = πr².","ideaTe":"వ్యాసం = 2r. చుట్టుకొలత = 2πr. వైశాల్యం = πr².","example":"r=7 cm, use π=22/7: circumference 44 cm, area 154 cm².","exampleTe":"r=7 సెం.మీ., π=22/7 తీసుకుంటే చుట్టుకొలత 44 సెం.మీ., వైశాల్యం 154 చ.సెం.మీ.","watch":"22/7 is an approximation to π, not its exact value.","watchTe":"22/7 అనేది πకు ఉజ్జాయింపు మాత్రమే; ఖచ్చితమైన విలువ కాదు."},{"topic":"similarity","minClass":10,"maxClass":10,"en":"Similar triangles","te":"సరూప త్రిభుజాలు","idea":"Similar triangles have equal corresponding angles and proportional corresponding sides.","ideaTe":"సరూప త్రిభుజాల్లో అనురూప కోణాలు సమానం; అనురూప భుజాలు ఒకే నిష్పత్తిలో ఉంటాయి.","example":"Side scale factor 3: a side of 4 becomes 12. Area scale factor is 9.","exampleTe":"భుజాల నిష్పత్తి 3 అయితే 4 భుజం 12 అవుతుంది. వైశాల్యాల నిష్పత్తి 9.","watch":"Area scale is the square of side scale.","watchTe":"వైశాల్యాల నిష్పత్తి భుజాల నిష్పత్తి వర్గం."},{"topic":"lines-angles","minClass":6,"maxClass":10,"en":"Lines and angle pairs","te":"రేఖలు, కోణాల జతలు","idea":"A ray has one endpoint. An angle measures the turn between two rays. A linear pair totals 180°.","ideaTe":"కిరణానికి ఒక చివర ఉంటుంది. రెండు కిరణాల మధ్య మలుపు కోణం. రేఖీయ కోణాల జత మొత్తం 180°.","example":"One angle is 65° on a straight line. The other is 180−65 = 115°.","exampleTe":"సరళరేఖపై ఒక కోణం 65°. మరొకటి 180−65 = 115°.","watch":"Adjacent angles total 180° only when their outer rays form a straight line.","watchTe":"పక్కపక్క కోణాల బయటి కిరణాలు సరళరేఖ ఏర్పరిచినప్పుడే మొత్తం 180°."},{"topic":"symmetry","minClass":6,"maxClass":8,"en":"Reflection symmetry","te":"ప్రతిబింబ సౌష్టవం","idea":"A symmetry line divides a figure into matching reflected halves.","ideaTe":"సౌష్టవ రేఖ ఆకారాన్ని ప్రతిబింబాలుగా సరిపోయే రెండు భాగాలుగా విడగొడుతుంది.","example":"A non-square rectangle has 2 symmetry lines: vertical and horizontal through its centre.","exampleTe":"చతురస్రం కాని దీర్ఘచతురస్రానికి మధ్య నుంచి నిలువు, అడ్డంగా 2 సౌష్టవ రేఖలు.","watch":"A rectangle's diagonals are not generally symmetry lines.","watchTe":"దీర్ఘచతురస్ర కర్ణాలు సాధారణంగా సౌష్టవ రేఖలు కావు."},{"topic":"pythagoras","minClass":8,"maxClass":10,"en":"Pythagoras theorem","te":"పైథాగరస్ సిద్ధాంతం","idea":"In a right triangle, the square of the hypotenuse equals the sum of squares of the other sides.","ideaTe":"లంబకోణ త్రిభుజంలో కర్ణం వర్గం మిగిలిన రెండు భుజాల వర్గాల మొత్తానికి సమానం.","example":"3²+4²=9+16=25=5². Hypotenuse is 5.","exampleTe":"3²+4²=9+16=25=5². కర్ణం 5.","watch":"This formula requires a right triangle; the hypotenuse is opposite 90°.","watchTe":"ఈ సూత్రానికి లంబకోణ త్రిభుజం కావాలి. 90°కు ఎదురుగా ఉన్నది కర్ణం."},{"topic":"constructions","minClass":6,"maxClass":8,"en":"Construct a square","te":"చతురస్ర నిర్మాణం","idea":"Use a ruler for lengths and a compass or set square for perpendicular lines. A square has equal sides and four right angles.","ideaTe":"పొడవులకు స్కేలు, లంబరేఖలకు దిక్సూచి లేదా సెట్ స్క్వేర్ వాడండి. చతురస్రానికి సమాన భుజాలు, నాలుగు లంబకోణాలు.","example":"Draw AB=4 cm. Erect perpendiculars at A and B. Mark AD=BC=4 cm on the same side. Join C to D.","exampleTe":"AB=4 సెం.మీ. గీయండి. A,Bల వద్ద లంబాలు గీయండి. ఒకే వైపు AD=BC=4 సెం.మీ. గుర్తించండి. C,Dలను కలపండి.","watch":"The on-screen diagram is a guide, not a true-scale printable ruler.","watchTe":"తెర బొమ్మ సూచన మాత్రమే. దాన్ని నిజమైన కొలతల స్కేలుగా వాడవద్దు."},{"topic":"graphs","minClass":6,"maxClass":10,"en":"Reading bar and line graphs","te":"స్తంభ, రేఖా చిత్రాలు చదవడం","idea":"A graph connects values with labels and a scale. Read the axis scale before comparing heights. Bar charts compare categories; line graphs can show change over time.","ideaTe":"చిత్రంలో విలువలు, పేర్లు, కొలబద్ద ఉంటాయి. ఎత్తులు పోల్చే ముందు అక్షంపై కొలబద్ద చూడండి. స్తంభచిత్రం వర్గాలను పోలుస్తుంది; రేఖాచిత్రం కాలంతో మార్పును చూపగలదు.","example":"Books read on Monday, Tuesday and Wednesday: 2, 5, 3. Total = 10. Tuesday has 3 more than Monday.","exampleTe":"సోమ, మంగళ, బుధవారాల్లో చదివిన పుస్తకాలు 2,5,3. మొత్తం 10. సోమవారం కంటే మంగళవారం 3 ఎక్కువ.","watch":"A tall bar does not always mean a large difference. Check whether the vertical axis starts at zero and whether the scale is uniform.","watchTe":"ఎత్తైన స్తంభం ఎప్పుడూ పెద్ద తేడా అని కాదు. నిలువు అక్షం సున్నా నుంచి మొదలైందో, కొలబద్ద సమానంగా ఉందో చూడండి."},{"topic":"grouped-statistics","minClass":10,"maxClass":10,"en":"Grouped data: estimated mean","te":"వర్గీకృత దత్తాంశం: అంచనా సగటు","idea":"When only class intervals and frequencies are known, represent each interval by its midpoint. Estimated mean = sum(frequency × midpoint) ÷ total frequency.","ideaTe":"తరగతి అంతరాలు, పౌనఃపున్యాలు మాత్రమే తెలిస్తే ప్రతి అంతరానికి మధ్యవిలువ తీసుకోండి. అంచనా సగటు = (పౌనఃపున్యం × మధ్యవిలువ) లబ్ధాల మొత్తం ÷ మొత్తం పౌనఃపున్యం.","example":"Intervals 0–10, 10–20, 20–30 have frequencies 2, 3, 1. Midpoints 5,15,25. Estimated mean = (2×5+3×15+1×25)/6 = 80/6 ≈ 13.33.","exampleTe":"0–10,10–20,20–30 అంతరాలకు పౌనఃపున్యాలు 2,3,1. మధ్యవిలువలు 5,15,25. అంచనా సగటు = (2×5+3×15+1×25)/6 = 80/6 ≈ 13.33.","watch":"This is generally an estimate: the original values inside each interval are unknown. Grouped median and mode need different formulae and are not covered by this mean lesson.","watchTe":"అంతరాల్లో అసలు విలువలు తెలియవు కాబట్టి ఇది సాధారణంగా అంచనా. వర్గీకృత మధ్యగతం, బాహుళకానికి వేరే సూత్రాలు కావాలి; ఈ సగటు పాఠంలో అవి లేవు."},{"topic":"congruence","minClass":7,"maxClass":10,"en":"Triangle congruence: correspondence","te":"త్రిభుజ సర్వసమానత్వం: అనురూపత","idea":"Congruent triangles have the same shape and size. Correctly match corresponding vertices before comparing sides and angles. SSS, SAS and ASA are congruence criteria; AAA alone gives similarity, not necessarily congruence.","ideaTe":"సర్వసమాన త్రిభుజాల ఆకారం, పరిమాణం ఒకటే. భుజాలు, కోణాలు పోల్చే ముందు అనురూప శీర్షాలు సరిగా జతచేయండి. SSS,SAS,ASA సర్వసమానత్వ నియమాలు. AAAతో సరూపత మాత్రమే తెలుస్తుంది; పరిమాణం సమానం కావాల్సిన అవసరం లేదు.","example":"If △ABC ≅ △PQR, the order gives A↔P, B↔Q, C↔R. Therefore AB=PQ, BC=QR, AC=PR and angle B=angle Q.","exampleTe":"△ABC ≅ △PQR అయితే క్రమం ప్రకారం A↔P,B↔Q,C↔R. కాబట్టి AB=PQ,BC=QR,AC=PR; B కోణం = Q కోణం.","watch":"For SAS the equal angle must be between the two equal sides. Two sides and a non-included angle are not a general congruence rule.","watchTe":"SASలో సమాన కోణం ఇచ్చిన రెండు సమాన భుజాల మధ్య ఉండాలి. రెండు భుజాలు, వాటి మధ్య కాని కోణం సాధారణ సర్వసమానత్వ నియమం కాదు."},{"topic":"trig-identity","minClass":10,"maxClass":10,"en":"Why sin²θ + cos²θ = 1","te":"sin²θ + cos²θ = 1 ఎందుకు?","idea":"For an acute angle in a right triangle, let opposite=a, adjacent=b and hypotenuse=c. Pythagoras gives a²+b²=c². Divide every term by c² to get (a/c)²+(b/c)²=1, hence sin²θ+cos²θ=1.","ideaTe":"లంబకోణ త్రిభుజంలోని అల్ప కోణానికి ఎదురుభుజం a, ఆసన్నభుజం b, కర్ణం c అనుకుందాం. పైథాగరస్ ప్రకారం a²+b²=c². ప్రతి పదాన్ని c²తో భాగిస్తే (a/c)²+(b/c)²=1. కాబట్టి sin²θ+cos²θ=1.","example":"For sides 3,4,5: sin²θ+cos²θ=(3/5)²+(4/5)²=9/25+16/25=1.","exampleTe":"3,4,5 భుజాలకు: sin²θ+cos²θ=(3/5)²+(4/5)²=9/25+16/25=1.","watch":"sin²θ means (sin θ)², not sin(θ²). The right-triangle proof here covers acute angles; extending trigonometry to other angles uses further definitions.","watchTe":"sin²θ అంటే (sin θ)²; sin(θ²) కాదు. ఇక్కడి లంబకోణ త్రిభుజ నిరూపణ అల్ప కోణాలకు. ఇతర కోణాలకు విస్తరించడానికి అదనపు నిర్వచనాలు అవసరం."},{"topic":"heights-distances","minClass":10,"maxClass":10,"en":"Heights and distances","te":"ఎత్తులు, దూరాలు","idea":"Draw a right triangle. Angle of elevation is measured upward from the observer's horizontal line. tan θ = vertical rise ÷ horizontal distance. Include eye height if the observer is above ground.","ideaTe":"లంబకోణ త్రిభుజం గీయండి. పరిశీలకుని అడ్డరేఖ నుంచి పైకి కొలిచేది ఊర్ధ్వకోణం. tan θ = నిలువు ఎత్తు పెరుగుదల ÷ అడ్డదూరం. పరిశీలకుని కళ్ళు నేలపై ఉంటే కంటి ఎత్తును కూడా కలపాలి.","example":"At horizontal distance 12 m, angle of elevation 45°, eye height 1.5 m: rise = 12×tan45°=12 m. Total height = 12+1.5=13.5 m.","exampleTe":"అడ్డదూరం 12 మీ., ఊర్ధ్వకోణం 45°, కంటి ఎత్తు 1.5 మీ. అయితే ఎత్తు పెరుగుదల = 12×tan45°=12 మీ. మొత్తం ఎత్తు = 12+1.5=13.5 మీ.","watch":"The sloping line of sight is not the horizontal distance. The example assumes level ground and a vertical object.","watchTe":"ఏటవాలు దృష్టిరేఖ అడ్డదూరం కాదు. ఉదాహరణలో నేల సమతలంగా, వస్తువు నిలువుగా ఉన్నట్లు భావించాం."},{"topic":"grouped-median","minClass":10,"maxClass":10,"en":"Grouped data: estimated median","te":"వర్గీకృత దత్తాంశం: అంచనా మధ్యగతం","idea":"Add frequencies cumulatively. Find the interval whose cumulative frequency first reaches or exceeds N/2. Use median ≈ L + ((N/2 − C)/f) × h, where L is that interval's lower boundary, C cumulative frequency before it, f its frequency and h its width.","ideaTe":"పౌనఃపున్యాలను సంచితంగా కలపండి. N/2ను మొదట చేరే లేదా దాటే అంతరం మధ్యగత అంతరం. మధ్యగతం ≈ L+((N/2−C)/f)×h. ఇక్కడ L ఆ అంతరం దిగువ హద్దు,C దానికి ముందున్న సంచిత పౌనఃపున్యం,f ఆ అంతరం పౌనఃపున్యం,h వెడల్పు.","example":"Intervals [0,10),[10,20),[20,30), frequencies 2,6,2. N=10,N/2=5. Middle interval: L=10,C=2,f=6,h=10. Median ≈ 10+(5−2)/6×10=15.","exampleTe":"[0,10),[10,20),[20,30) అంతరాల పౌనఃపున్యాలు 2,6,2. N=10,N/2=5. మధ్య అంతరానికి L=10,C=2,f=6,h=10. మధ్యగతం ≈ 10+(5−2)/6×10=15.","watch":"This interpolation estimates a grouped-data median. It is not the exact median of unknown original observations. Use continuous class boundaries; do not divide by zero frequency.","watchTe":"ఇది వర్గీకృత దత్తాంశంలో అంతర్వేశన అంచనా. తెలియని అసలు పరిశీలనల ఖచ్చిత మధ్యగతం కాదు. అవిచ్ఛిన్న తరగతి హద్దులు వాడండి; సున్నా పౌనఃపున్యంతో భాగించవద్దు."},{"topic":"grouped-mode","minClass":10,"maxClass":10,"en":"Grouped data: estimated mode","te":"వర్గీకృత దత్తాంశం: అంచనా బాహుళకం","idea":"For equal-width continuous intervals with one clear modal class, mode ≈ L + ((f₁−f₀)/(2f₁−f₀−f₂))×h. L is the modal class lower boundary; f₁ its frequency; f₀ and f₂ the neighbouring frequencies; h the class width.","ideaTe":"సమాన వెడల్పు అవిచ్ఛిన్న అంతరాల్లో ఒక స్పష్టమైన బాహుళక తరగతి ఉంటే బాహుళకం ≈ L+((f₁−f₀)/(2f₁−f₀−f₂))×h. L బాహుళక తరగతి దిగువ హద్దు,f₁ దాని పౌనఃపున్యం,f₀,f₂ పక్క తరగతుల పౌనఃపున్యాలు,h వెడల్పు.","example":"Intervals [0,10),[10,20),[20,30), frequencies 2,8,4. Modal class [10,20): mode ≈ 10+(8−2)/(16−2−4)×10=16.","exampleTe":"[0,10),[10,20),[20,30) పౌనఃపున్యాలు 2,8,4. బాహుళక తరగతి [10,20). బాహుళకం ≈ 10+(8−2)/(16−2−4)×10=16.","watch":"The modal class is an interval, while estimated mode is a value. Equal highest frequencies or unequal widths need extra care; this lesson does not force a unique mode in those cases.","watchTe":"బాహుళక తరగతి ఒక అంతరం; అంచనా బాహుళకం ఒక విలువ. సమాన అత్యధిక పౌనఃపున్యాలు లేదా అసమాన వెడల్పులకు అదనపు జాగ్రత్త అవసరం. అలాంటి సందర్భాల్లో ఒకే బాహుళకాన్ని బలవంతంగా ఎంచుకోము."},{"topic":"circle-tangents","minClass":10,"maxClass":10,"en":"Equal tangents from one point","te":"ఒక బాహ్య బిందువు నుంచి సమాన స్పర్శరేఖాఖండాలు","idea":"From an external point P, let PA and PB be tangent segments to a circle with centre O. Radii OA and OB are perpendicular to the tangents at A and B. Both right triangles share hypotenuse OP and have equal radii.","ideaTe":"వృత్తానికి బాహ్య బిందువు P నుంచి PA,PB స్పర్శరేఖాఖండాలు అనుకుందాం. కేంద్రం O నుంచి వ్యాసార్థాలు OA,OB స్పర్శబిందువుల వద్ద స్పర్శరేఖలకు లంబం. రెండు లంబకోణ త్రిభుజాలకు కర్ణం OP ఉమ్మడి; వ్యాసార్థాలు సమానం.","example":"Pythagoras: PA²=OP²−OA² and PB²=OP²−OB². Since OA=OB, PA²=PB². Lengths are nonnegative, so PA=PB. If PA=7 cm, PB=7 cm.","exampleTe":"పైథాగరస్: PA²=OP²−OA²,PB²=OP²−OB². OA=OB కాబట్టి PA²=PB². పొడవులు రుణం కావు కాబట్టి PA=PB. PA=7 సెం.మీ. అయితే PB=7 సెం.మీ.","watch":"P must be external and both segments must be tangents to the same circle. A secant cutting the circle twice is not a tangent. The perpendicular-radius tangent theorem is used here as a known result.","watchTe":"P బాహ్య బిందువు కావాలి; రెండు రేఖాఖండాలు ఒకే వృత్తానికి స్పర్శరేఖాఖండాలు కావాలి. వృత్తాన్ని రెండుచోట్ల కోసే రేఖ స్పర్శరేఖ కాదు. వ్యాసార్థం–స్పర్శరేఖ లంబ సిద్ధాంతాన్ని ఇక్కడ తెలిసిన ఫలితంగా వాడాం."}];

function groupedAndTangentsLab(id){
 if(!['grouped-median','grouped-mode','circle-tangents'].includes(id))return;
 const box=document.createElement('section');box.className='card math-lab';box.id='r6-lab';document.querySelector('.worked').insertAdjacentElement('afterend',box);
 if(id.startsWith('grouped-')){
  const isMedian=id==='grouped-median',initial=isMedian?[2,6,2]:[2,8,4];
  box.innerHTML=`<h2>${isMedian?T('Find the middle','మధ్యగతం కనుక్కోండి'):T('Find the modal class','బాహుళక తరగతి కనుక్కోండి')}</h2><p>${T('The continuous intervals have equal width 10. Each includes its left endpoint and excludes its right endpoint. Set whole frequencies from 0 to 20.','ఈ అవిచ్ఛిన్న అంతరాల వెడల్పు సమానంగా 10. ఎడమ చివర విలువ చేరుతుంది; కుడి చివర విలువ చేరదు. 0 నుంచి 20 మధ్య పూర్ణ పౌనఃపున్యాలు ఇవ్వండి.')}</p><div class="tablewrap"><table><thead><tr><th>${T('Interval','అంతరం')}</th><th>f</th><th><abbr title="${T('Cumulative frequency','సంచిత పౌనఃపున్యం')}">CF</abbr></th></tr></thead><tbody>${initial.map((f,i)=>`<tr><td>[${10*i},${10*i+10})</td><td><label class="sr-label" for="r6-f-${i}">${T('Frequency','పౌనఃపున్యం')} ${i+1}</label><input id="r6-f-${i}" type="number" min="0" max="20" step="1" value="${f}" inputmode="numeric"></td><td id="r6-cf-${i}"></td></tr>`).join('')}</tbody></table></div><p>${T('CF means cumulative frequency. Highlighted row is the class used in the estimate.','CF అంటే సంచిత పౌనఃపున్యం. ప్రత్యేక రంగులో ఉన్న వరుస అంచనాలో వాడే తరగతి.')}</p><output id="r6-answer" aria-live="polite"></output><p>${T('This estimates a value from grouped data; the exact median or mode of the unknown original observations is not recovered.','వర్గీకృత దత్తాంశం నుంచి ఇది అంచనా విలువ మాత్రమే. తెలియని అసలు పరిశీలనల ఖచ్చిత మధ్యగతం లేదా బాహుళకాన్ని తిరిగి పొందలేం.')}</p>`;
  const draw=()=>{let vals=[0,1,2].map(i=>Number($('#r6-f-'+i).value)),out=$('#r6-answer'),cells=[...box.querySelectorAll('tbody tr')];cells.forEach(c=>{c.style.background='';c.style.boxShadow=''});[0,1,2].forEach(i=>$('#r6-cf-'+i).textContent='–');
   if(vals.some((v,i)=>$('#r6-f-'+i).value===''||!Number.isInteger(v)||v<0||v>20)){out.textContent=T('Enter whole frequencies from 0 to 20.','0 నుంచి 20 మధ్య పూర్ణ పౌనఃపున్యాలు ఇవ్వండి.');return}
   let n=vals.reduce((a,b)=>a+b,0),cf=0;vals.forEach((v,i)=>{$('#r6-cf-'+i).textContent=cf+=v});
   if(!n){out.textContent=T('No observations: the estimate is undefined.','పరిశీలనలు లేవు: అంచనా నిర్వచించబడదు.');return}
   if(isMedian){let sum=0,index=vals.findIndex(v=>(sum+=v)>=n/2),c=vals.slice(0,index).reduce((a,b)=>a+b,0),f=vals[index],L=index*10,result=L+(n/2-c)/f*10;cells[index].style.background='color-mix(in srgb, var(--panel) 85%, #16846c 15%)';cells[index].style.boxShadow='inset 4px 0 #16846c';out.textContent=`N=${n}; N/2=${n/2}; L=${L}; C=${c}; f=${f}; h=10. ${T('Estimated median','అంచనా మధ్యగతం')} = ${L}+((${n/2}−${c})/${f})×10 ≈ ${result.toFixed(2)}`;
   }else{let max=Math.max(...vals),leaders=vals.map((v,i)=>v===max?i:-1).filter(i=>i>=0);if(leaders.length!==1){out.textContent=T('The highest frequency is tied. This lesson does not select a unique modal class or estimate.','అత్యధిక పౌనఃపున్యం ఒకటి కంటే ఎక్కువ తరగతులకు ఉంది. ఈ పాఠం ఒకే బాహుళక తరగతిని లేదా అంచనాను ఎంచుకోదు.');return}let i=leaders[0];cells[i].style.background='color-mix(in srgb, var(--panel) 85%, #16846c 15%)';cells[i].style.boxShadow='inset 4px 0 #16846c';if(i!==1){out.textContent=T('The modal class is at an edge. This demonstration uses an interior modal class with two known neighbours. Increase the middle frequency to continue.','బాహుళక తరగతి చివరన ఉంది. ఈ ప్రదర్శనలో రెండు తెలిసిన పక్క తరగతులు గల మధ్య బాహుళక తరగతి వాడతాం. కొనసాగడానికి మధ్య తరగతి పౌనఃపున్యం పెంచండి.');return}let [f0,f1,f2]=vals,den=2*f1-f0-f2,result=10+(f1-f0)/den*10;out.textContent=`L=10; f₀=${f0}; f₁=${f1}; f₂=${f2}; h=10. ${T('Estimated mode','అంచనా బాహుళకం')} = 10+((${f1}−${f0})/(2×${f1}−${f0}−${f2}))×10 ≈ ${result.toFixed(2)}`}

 }else{
  box.innerHTML=`<h2>${T('Why the tangent lengths match','స్పర్శరేఖాఖండాల పొడవులు ఎందుకు సమానం?')}</h2><svg viewBox="0 0 360 230" role="img" aria-label="${T('Circle centre O, external point P, tangent points A and B','కేంద్రం O గల వృత్తం, బాహ్య బిందువు P, స్పర్శబిందువులు A,B')}"><circle cx="150" cy="115" r="62" fill="#f3e8ff" stroke="#8a41bb" stroke-width="3"/><path d="M150 115 L181 61.31 L274 115 L181 168.69 Z" fill="#d9f6ef" fill-opacity=".5" stroke="#188c7a" stroke-width="2"/><path d="M181 61.31 L274 115 L181 168.69 M150 115 L274 115" fill="none" stroke="#274c85" stroke-width="3"/><g fill="#153f62"><text x="130" y="119">O</text><text x="281" y="121">P</text><text x="178" y="49">A</text><text x="178" y="192">B</text></g></svg><p>${T('Schematic. OA⊥PA and OB⊥PB. PA and PB touch the same circle at exactly one point each.','సూచన బొమ్మ. OA⊥PA,OB⊥PB. PA,PB ఒకే వృత్తాన్ని ఒక్కో స్పర్శబిందువు వద్ద తాకుతాయి.')}</p><ol><li>${T('OA=OB because both are radii.','OA,OB వ్యాసార్థాలు కాబట్టి సమానం.')}</li><li>PA²=OP²−OA²; PB²=OP²−OB².</li><li>${T('Therefore PA²=PB². Lengths are nonnegative, so PA=PB.','అందువల్ల PA²=PB². పొడవులు రుణం కావు కాబట్టి PA=PB.')}</li></ol><label for="tangent-example">${T('Check a numeric example','సంఖ్యల ఉదాహరణ తనిఖీ')}</label><select id="tangent-example"><option value="0">r=3, OP=5</option><option value="1">r=5, OP=13</option><option value="2">r=8, OP=17</option></select><output id="tangent-values" aria-live="polite"></output><p>${T('The radius-perpendicular-to-tangent theorem is assumed here. This is a proof of equal lengths using that theorem, not a proof of the perpendicular theorem itself.','వ్యాసార్థం–స్పర్శరేఖ లంబ సిద్ధాంతాన్ని ఇక్కడ తెలిసినదిగా తీసుకున్నాం. దాన్ని వాడి సమాన పొడవుల నిరూపణ ఇది; ఆ లంబ సిద్ధాంతాన్నే నిరూపించడం కాదు.')}</p>`;
